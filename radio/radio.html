<style>
  /* =====================================================
     LO-FI RADIO · визуальный язык жанра:
     «синий час» — глубокий индиго + тёплый янтарь лампы,
     плёночное зерно, царапины, мягкие округлые формы,
     приглушённая типографика. Тёмная тема как основная.
     ===================================================== */
  :root {
    --ink:      #0a0810;
    --night:    #141020;
    --night-2:  #1c1630;
    --line:     rgba(233,169,92,0.14);
    --amber:    #e9a95c;
    --amber-2:  #c98b4a;
    --rose:     #d19a8c;
    --sage:     #93a583;
    --cream:    #ece0cc;
    --dim:      #8b7d92;
    --dimmer:   #5f5468;
    /* Кассета: тёплый матовый пластик и бумага вкладыша */
    --plastic:  #241d2c;
    --plastic-2:#1a1522;
    --paper:    #e3d6bd;
    --paper-2:  #cfc0a4;
    --mono: ui-monospace, 'SFMono-Regular', 'Courier New', monospace;
    --ui: 'Nunito', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --display: 'Baloo 2', 'Nunito', system-ui, -apple-system, sans-serif;
    --hand: 'Caveat', 'Segoe Script', 'Comic Sans MS', cursive;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: var(--ink);
    color: var(--cream);
    font-family: var(--ui);
    padding: 20px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* Фон: два источника света в комнате + виньетка */
  .bg {
    position: fixed; inset: 0; z-index: -2;
    background:
      radial-gradient(60% 45% at 22% 12%, rgba(233,169,92,0.16), transparent 70%),
      radial-gradient(70% 60% at 82% 92%, rgba(111,106,208,0.14), transparent 72%),
      linear-gradient(170deg, #16112a 0%, #0c0916 55%, #08060e 100%);
  }
  /* Зерно плёнки: живое, дышит по кадрам */
  .grain {
    position: fixed; inset: -50%; z-index: -1; pointer-events: none;
    opacity: 0.07; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
    animation: grain 0.7s steps(6) infinite;
  }
  @keyframes grain {
    0%   { transform: translate(0,0); }
    20%  { transform: translate(-3%,2%); }
    40%  { transform: translate(2%,-3%); }
    60%  { transform: translate(-2%,-2%); }
    80%  { transform: translate(3%,1%); }
    100% { transform: translate(0,0); }
  }
  /* Скан-линии старого экрана */
  .scan {
    position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.35;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.20) 2px 3px);
  }
  .vignette {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(120% 90% at 50% 45%, transparent 45%, rgba(0,0,0,0.62) 100%);
  }

  /* ---------- Корпус: матовая кассетная дека, а не стеклянная карточка ---------- */
  .radio {
    position: relative; z-index: 1;
    width: 100%; max-width: 428px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='2'/></filter><rect width='180' height='180' filter='url(%23p)' opacity='0.5'/></svg>"),
      linear-gradient(180deg, #2a2130 0%, #1c1626 42%, #140f1c 100%);
    background-size: 180px 180px, 100% 100%;
    background-blend-mode: soft-light, normal;
    border: 1px solid rgba(233,169,92,0.13);
    border-radius: 22px;
    padding: 20px 20px 16px;
    box-shadow:
      0 34px 70px rgba(0,0,0,0.82),
      0 1px 0 rgba(236,224,204,0.07) inset,
      0 -18px 40px rgba(0,0,0,0.35) inset,
      0 0 0 1px rgba(0,0,0,0.45);
  }
  /* Разъём/винт по углам — мелочь, но читается как корпус прибора */
  .radio::after {
    content: ''; position: absolute; inset: 8px; border-radius: 16px;
    border: 1px solid rgba(236,224,204,0.045); pointer-events: none;
  }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    font-family: var(--ui); font-size: 10px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--dim); margin-bottom: 14px;
  }
  .brand { color: var(--cream); font-weight: 600; letter-spacing: 1.6px; opacity: 0.85; }
  .topbar .left { display: flex; align-items: center; }
  /* Тихий вход в список жанровых станций */
  .stations-link {
    margin-left: 12px; color: var(--dimmer); text-decoration: none;
    font-size: 10px; letter-spacing: 1.2px; text-transform: uppercase;
    transition: color 0.2s ease;
  }
  .stations-link:hover { color: var(--amber); }
  .side { color: var(--dimmer); font-family: var(--mono); letter-spacing: 1.6px; font-size: 9px; }
  .topbar .right { display: flex; align-items: center; gap: 10px; }
  /* Ссылка на трек: тихая кнопка в верхней панели */
  .share {
    display: inline-flex; align-items: center; gap: 5px;
    background: none; border: none; padding: 2px 3px; cursor: pointer;
    font-family: var(--ui); font-size: 10px; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--dimmer);
    transition: color 0.2s ease;
  }
  .share:hover, .share.done { color: var(--amber); }
  .share svg { width: 12px; height: 12px; display: block; }
  .live-dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%;
    background: var(--amber); margin-right: 6px; vertical-align: middle;
    box-shadow: 0 0 8px var(--amber); animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.25; } }

  /* ---------- Кассета: бумажный вкладыш (J-card) + шелл с катушками ---------- */
  .cassette { position: relative; }
  .jcard {
    position: relative; width: 100%; padding: 9px; overflow: hidden;
    border-radius: 10px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='j'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23j)' opacity='0.4'/></svg>"),
      linear-gradient(160deg, var(--paper) 0%, var(--paper-2) 100%);
    background-size: 140px 140px, 100% 100%;
    background-blend-mode: multiply, normal;
    box-shadow: 0 16px 34px rgba(0,0,0,0.62), 0 1px 0 rgba(255,255,255,0.28) inset;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1), opacity 0.35s ease;
  }
  /* Перелистывание: уводим и возвращаем */
  .jcard.switching { opacity: 0; transform: scale(0.965) rotate(-0.6deg); }
  .jcard canvas { display: block; width: 100%; aspect-ratio: 1/1; border-radius: 5px; }
  /* Блик по бумаге — очень слабый, вкладыш матовый */
  .jcard-sheen {
    position: absolute; inset: 0; pointer-events: none; border-radius: 10px;
    background: linear-gradient(152deg, rgba(255,255,255,0.10) 0%, transparent 36%);
  }
  /* Редкая полоса трекинга: протягивается сверху вниз раз в ~17 с */
  .track-band {
    position: absolute; left: 9px; right: 9px; top: 9px; height: 3px;
    pointer-events: none; opacity: 0; filter: blur(0.5px);
    background: linear-gradient(90deg, transparent, rgba(236,224,204,0.20) 14%,
                rgba(255,255,255,0.13) 50%, rgba(236,224,204,0.20) 86%, transparent);
    animation: trackband 17s linear infinite;
  }
  @keyframes trackband {
    0%, 87%  { opacity: 0;   transform: translateY(0); }
    89%      { opacity: 0.9; transform: translateY(52px); }
    92%      { opacity: 0.45;transform: translateY(178px); }
    95%      { opacity: 0.75;transform: translateY(312px); }
    97%,100% { opacity: 0;   transform: translateY(430px); }
  }

  /* ---------- Шелл кассеты: две катушки и окно ленты ---------- */
  .shell {
    position: relative; height: 58px; margin: 10px 2px 0;
    display: flex; align-items: center; justify-content: center; gap: 11px;
    border-radius: 9px;
    background:
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='s'><feTurbulence type='fractalNoise' baseFrequency='1.1' numOctaves='2'/></filter><rect width='120' height='120' filter='url(%23s)' opacity='0.35'/></svg>"),
      linear-gradient(180deg, #2e2638 0%, #221b2c 58%, #16111f 100%);
    background-size: 120px 120px, 100% 100%;
    background-blend-mode: soft-light, normal;
    box-shadow: 0 1px 0 rgba(236,224,204,0.09) inset, 0 10px 20px rgba(0,0,0,0.55),
                0 0 0 1px rgba(0,0,0,0.55);
  }
  /* Обе катушки крутятся в ОДНУ сторону (по часовой), с разной скоростью:
     лента перетекает с подающей на принимающую, поэтому обороты не совпадают. */
  .reel {
    position: relative; flex: 0 0 auto;
    width: 38px; height: 38px; border-radius: 50%;
    background: radial-gradient(circle at 50% 42%, #352c42 0%, #1d1727 72%);
    box-shadow: 0 0 0 1px rgba(236,224,204,0.11) inset, 0 0 0 4px rgba(0,0,0,0.30);
    animation: reels 5.4s linear infinite;
    animation-play-state: paused;
  }
  .reel.right { animation-duration: 4.2s; }
  .playing .reel { animation-play-state: running; }
  .reel::before {                 /* спицы */
    content: ''; position: absolute; inset: 6px; border-radius: 50%;
    background: repeating-conic-gradient(from 0deg,
      rgba(236,224,204,0.15) 0 11deg, transparent 11deg 60deg);
  }
  .reel::after {                  /* втулка */
    content: ''; position: absolute; left: 50%; top: 50%;
    width: 11px; height: 11px; margin: -5.5px 0 0 -5.5px; border-radius: 50%;
    background: radial-gradient(circle, #4b4059, #241d2e);
    box-shadow: 0 0 0 1px rgba(0,0,0,0.55);
  }
  @keyframes reels { to { transform: rotate(360deg); } }
  .tape-window {
    position: relative; flex: 1 1 auto; max-width: 122px; height: 22px;
    border-radius: 4px; overflow: hidden;
    background: linear-gradient(180deg, rgba(4,3,8,0.75), rgba(2,2,5,0.9));
    box-shadow: 0 0 0 1px rgba(236,224,204,0.08) inset;
  }
  .tape-window i {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(90deg,
      rgba(236,224,204,0.07) 0 1px, transparent 1px 6px);
    animation: tape 1.15s linear infinite;
    animation-play-state: paused;
  }
  .playing .tape-window i { animation-play-state: running; }
  /* Лента в окне бежит в ту же сторону, что и низ катушек — влево */
  @keyframes tape { to { transform: translateX(-6px); } }
  /* Подпись под шеллом — как на этикетке кассеты */
  .shell-cap {
    display: flex; align-items: center; justify-content: space-between;
    margin: 8px 3px 0; font-family: var(--mono); font-size: 8.5px;
    letter-spacing: 1.5px; text-transform: uppercase; color: var(--dimmer);
  }
  .shell-cap .cat { color: rgba(233,169,92,0.55); }
  .hand-note {
    font-family: var(--hand); font-size: 15px; color: rgba(211,196,168,0.72);
    letter-spacing: 0.3px; text-transform: none;
  }

  /* ---------- Название трека: мягкий округлый шрифт, без сурового моно ---------- */
  .meta { padding: 15px 2px 11px; }
  .track {
    font-family: var(--display);
    font-size: 23px; font-weight: 600; letter-spacing: 0.1px;
    color: var(--cream); line-height: 1.2;
    text-shadow: -0.6px 0 rgba(224,120,110,0.22), 0.6px 0 rgba(110,180,220,0.20);
    transition: opacity 0.3s ease;
  }
  .track.switching { opacity: 0; }
  .artist {
    font-family: var(--ui); font-weight: 400;
    font-size: 11.5px; letter-spacing: 0.5px;
    color: var(--dim); margin-top: 5px;
    transition: opacity 0.3s ease;
  }
  .artist.switching { opacity: 0; }

  /* ---------- Волна: мягкий силуэт ленты, а не частокол ---------- */
  .wave-wrap {
    position: relative; height: 48px; margin: 4px 0 13px;
    border-radius: 9px; overflow: hidden;
    background: linear-gradient(180deg, rgba(0,0,0,0.22), rgba(0,0,0,0.04));
    border: 1px solid rgba(236,224,204,0.05);
  }
  .wave-wrap canvas { display: block; width: 100%; height: 100%; }
  .wave-wrap::after {          /* мягкие штрихи ленты вместо жёсткой сетки */
    content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(to bottom,
      rgba(0,0,0,0) 0 5px, rgba(0,0,0,0.13) 5px 6px);
    opacity: 0.45;
  }
  /* Счётчик ленты: моно — здесь он уместен, так пишут на деке */
  .time {
    position: absolute; right: 9px; top: 6px;
    display: flex; align-items: center; gap: 6px;
    font-family: var(--mono); font-size: 9px; letter-spacing: 1px;
    color: var(--dimmer);
  }
  .time .vhs { color: rgba(233,169,92,0.0); font-size: 8px; transition: color 0.4s ease; }
  .playing .time .vhs { color: rgba(233,169,92,0.85); }

  /* ---------- Транспорт: клавиши кассетной деки ---------- */
  .transport { display: flex; align-items: center; justify-content: center; gap: 13px; margin: 2px 0 0; }
  .btn {
    font-family: var(--ui); cursor: pointer; border: none;
    transition: transform 0.12s ease, box-shadow 0.22s ease, background 0.22s ease, color 0.22s ease;
  }
  .btn:active { transform: translateY(2px); }
  .key {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    height: 46px; padding: 0 26px; border-radius: 7px;
    font-family: var(--display); font-weight: 600; font-size: 15px;
    letter-spacing: 0.5px; color: #211706;
    background: linear-gradient(180deg, #f2c079 0%, #d99f59 52%, #bd8244 100%);
    box-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.38) inset,
                0 10px 22px rgba(233,169,92,0.18);
  }
  .key:hover { filter: brightness(1.06); }
  .key.ghost {
    padding: 0 20px; color: var(--amber);
    background: linear-gradient(180deg, #2c2336 0%, #1a1424 100%);
    box-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 1px 0 rgba(236,224,204,0.07) inset,
                0 0 0 1px rgba(233,169,92,0.15) inset;
  }
  /* Пока играет — клавиша уходит вниз, как отжатая дека */
  .key.playing {
    color: var(--amber);
    background: linear-gradient(180deg, #241d2e 0%, #161121 100%);
    box-shadow: 0 1px 0 rgba(0,0,0,0.5), 0 1px 0 rgba(236,224,204,0.05) inset,
                0 0 0 1px rgba(233,169,92,0.22) inset;
  }
  .key svg { width: 16px; height: 16px; display: block; }

  /* ---------- Лента: громкость и подпись ---------- */
  .deck {
    margin-top: 16px; padding-top: 13px;
    border-top: 1px solid rgba(236,224,204,0.06);
    display: flex; align-items: center; gap: 11px;
  }
  .vol-ico { display: flex; color: var(--dim); }
  .vol-ico svg { width: 14px; height: 14px; display: block; }
  .vol {
    -webkit-appearance: none; appearance: none;
    flex: 1; height: 3px; border-radius: 3px; cursor: pointer; outline: none;
    background: linear-gradient(90deg, var(--amber-2) 0%, var(--amber-2) 78%, rgba(236,224,204,0.12) 78%);
  }
  .vol::-webkit-slider-thumb {
    -webkit-appearance: none; width: 12px; height: 12px; border-radius: 50%;
    background: #f2d3a4; box-shadow: 0 0 0 1px rgba(10,8,16,0.65), 0 2px 8px rgba(0,0,0,0.5);
  }
  .vol::-moz-range-thumb {
    width: 12px; height: 12px; border: none; border-radius: 50%; background: #f2d3a4;
  }
  .flavor {
    font-family: var(--hand); font-size: 15px; letter-spacing: 0.2px;
    color: rgba(211,196,168,0.60); white-space: nowrap;
  }

  /* ---------- Ошибка ---------- */
  .error {
    display: none; margin-top: 12px; padding: 10px 12px;
    font-size: 11px; line-height: 1.5; color: #ffb3a7;
    background: rgba(209,154,140,0.10); border: 1px solid rgba(209,154,140,0.25);
    border-radius: 10px;
  }
  @media (max-width: 460px) {
    .radio { padding: 18px 16px 14px; border-radius: 20px; }
    .track { font-size: 19px; }
    .flavor { display: none; }
  }
  /* ---------- Встраивание: компактный плеер для страниц станций ----------
     В рамке высотой около 200 px вертикальная карточка не влезала целиком —
     её верх и низ обрезались. Здесь расклад идёт вбок: обложка слева,
     справа название, волна, управление. Катушки и подпись кассеты убираем:
     в рамке они только отъедают высоту. Верхнюю панель не прячем, а
     разбираем по частям — save и link нужны прямо в рамке, как на главной. */
  html.embed body { background: transparent; padding: 8px; }
  html.embed .bg, html.embed .grain, html.embed .scan, html.embed .vignette { display: none; }
  html.embed .topbar, html.embed .topbar .right, html.embed .transport { display: contents; }
  html.embed .brand, html.embed .stations-link, html.embed .topbar .side,
  html.embed .shell, html.embed .shell-cap { display: none; }
  html.embed .radio {
    display: grid; align-items: center;
    grid-template-columns: clamp(96px, 30%, 168px) auto auto auto auto 1fr;
    grid-template-areas:
      'cover meta meta meta meta meta'
      'cover wave wave wave wave wave'
      'cover play next save link spare'
      'cover deck deck deck deck deck';
    gap: 2px 6px; max-width: 520px; padding: 12px;
  }
  html.embed .cassette { grid-area: cover; margin-right: 8px; }
  html.embed .meta { grid-area: meta; padding: 0; }
  /* Название — не длиннее двух строк, подпись — в одну: иначе на узком
     экране рамка вырастает и в ней появляется прокрутка. */
  html.embed .track {
    font-size: 17px; display: -webkit-box; -webkit-line-clamp: 2;
    -webkit-box-orient: vertical; overflow: hidden;
  }
  html.embed .artist { font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  html.embed .wave-wrap { grid-area: wave; height: 34px; margin: 3px 0 0; }
  html.embed #playBtn { grid-area: play; }
  html.embed #nextBtn { grid-area: next; }
  html.embed #saveBtn { grid-area: save; }
  html.embed #shareBtn { grid-area: link; }

<script>
/* =====================================================
   LO-FI RADIO
   Аудио — AudioWorklet (lofi-processor → mastering → выход).
   Название и обложка трека генерируются процедурно из seed,
   который присылает ворклет: у каждой композиции своя картинка.
   ===================================================== */

let ctx = null, workletNode = null, analyser = null, masteringNode = null, masterGain = null;
let isPlaying = false;
let pendingSeed = null;
let progress = 0;          // 0..1 — докуда дошёл трек (рисуем плейхед по волне)
const VOL_KEY = 'lofi-vol';

/* =====================================================
   ЗЕРНО ТРЕКА
   Каждый новый трек — свежее случайное зерно, поэтому эфир
   никогда не повторяется. Зерно же задаёт трек целиком, поэтому
   ссылка ?t=<hex> и скачанный файл звучат ровно как эфир.
   Ни сервера, ни одного сохранённого байта аудио.
   ===================================================== */
const hex32 = n => (n >>> 0).toString(16).padStart(8, '0');

let linkSeed = null;       // зерно из ссылки: играем именно его
let forcedMood = null;     // слой из ссылки: страница станции держит свой жанр
let sentInitialSeed = false;

(function readLink() {
  const q = new URLSearchParams(location.search);
  const t = q.get('t');
  if (t && /^[0-9a-f]{1,8}$/i.test(t)) linkSeed = parseInt(t, 16) >>> 0;
  const m = q.get('m');
  if (m && /^[a-z0-9-]{2,16}$/.test(m)) forcedMood = m;
  // Встраивание: хозяину страницы нужен плеер, а не наша рамка
  if (q.get('embed') === '1') document.documentElement.classList.add('embed');
})();

// Ссылка на текущий трек — по требованию, а не постоянно в адресной строке:
// иначе перезагрузка возвращала бы тот же трек вместо нового случайного.
// Слой станции сохраняем: ссылка с страницы жанра остаётся в своём жанре.
function trackLink(seed) {
  const base = location.origin + location.pathname;
  return base + '?t=' + hex32(seed) + (forcedMood ? '&m=' + forcedMood : '');
}

// roundRect есть не во всех сборках — обложка не должна падать из-за углов
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const rr = Math.min(r, w / 2, h / 2);
    this.moveTo(x + rr, y);
    this.arcTo(x + w, y, x + w, y + h, rr);
    this.arcTo(x + w, y + h, x, y + h, rr);
    this.arcTo(x, y + h, x, y, rr);
    this.arcTo(x, y, x + w, y, rr);
    this.closePath();
    return this;
  };
}

const playBtn   = document.getElementById('playBtn');
const playLabel = document.getElementById('playLabel');

/* =====================================================
   1. ГЕНЕРАТОР НАЗВАНИЙ
   Лоу-фай называет треки строчными, коротко и по-домашнему:
   ночь, окно, дождь, лента, кружка. Собираем из слоёв по слоям жанра.
   ===================================================== */
const NAME = {
  dusty:        { adj:['dusty','worn','faded','analog','paper','velvet','warm','second-hand'],
                  noun:['tape','vinyl','crate','groove','sample','loop','cardigan','notebook','needle','sleeve'] },
  jazzhop:      { adj:['blue','smoky','mellow','late','velvet','soft','honey','uptown'],
                  noun:['keys','cafe','piano','rhodes','brushes','smoke','corner','session','harlem','bassline'] },
  chillhop:     { adj:['sunlit','easy','gentle','quiet','soft','open','morning'],
                  noun:['window','daydream','sunbeam','balcony','plant','kettle','porch','postcard','sweater','breeze'] },
  midnight:     { adj:['midnight','dark','lonely','cold','hollow','empty'],
                  noun:['streetlight','alley','rooftop','platform','train','rain','lamppost','signal','taxi','hotel'] },
  ambient:      { adj:['distant','slow','still','weightless','pale','frozen'],
                  noun:['field','drift','snow','tide','haze','cloud','harbor','glacier','orbit','fog'] },
  experimental: { adj:['broken','crooked','half','odd','glitchy','unfinished'],

                  noun:['cathedral','tunnel','abyss','glass','void','ash','mourning','drowned','stone','reliquary'] },
  trap:         { adj:['night','heavy','slow','cold','low'],
                  noun:['sub','drift','chrome','ghost','vault','static','ice','marble','smoke','signal'] },
  dub:          { adj:['deep','echoing','sunken','low','slow'],
                  noun:['echo','chamber','pressure','version','cavern','channel','tape','horn','well','trench'] },
  vapor:        { adj:['faded','pastel','warped','melted','slow'],
                  noun:['mall','plaza','sunset','palm','atrium','fountain','pool','arcade','lobby','cassette'] },
  chip:         { adj:['pixel','8-bit','tiny','bright','little'],
