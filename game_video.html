const GENRE_KEYS = Object.keys(GENRES);

// --- платформер: холмы в три слоя, платформы, деревья, птицы
function buildPlatformer(r, P) {
  return {
    layers: [0, 1, 2].map((i) => ({
      speed: [3, 7, 13][i], base: [126, 142, 160][i], amp: [30, 22, 14][i],
      freq: [0.010, 0.017, 0.028][i], seed: r() * 500,
      color: mix(P.sky[2], P.ink, [0.35, 0.6, 0.82][i]),
    })),
    trees: Array.from({ length: 14 }, () => ({ x: r() * VW, h: rndRange(r, 10, 22), layer: r() < 0.5 ? 1 : 2 })),
    clouds: Array.from({ length: 4 }, () => ({ x: r() * VW, y: rndRange(r, 16, 52), w: rndRange(r, 22, 46), s: rndRange(r, 1, 3) })),
    birds: Array.from({ length: 3 }, () => ({ x: r() * VW, y: rndRange(r, 34, 60), s: rndRange(r, 1, 2), p: r() * 6 })),
  };
}
function drawPlatformer(s, P, t) {
  const clouds = s.clouds;
  for (const c of clouds) {
    const x = ((c.x + t * c.s) % (VW + 80) + VW + 80) % (VW + 80) - 40;
    ditherFill(x, c.y, c.w, 5, rgba(P.light > 180 ? P.sky[2] : P.glow, 0.55), 0);
    ditherFill(x + 5, c.y - 4, c.w - 12, 4, rgba(P.light > 180 ? P.sky[2] : P.glow, 0.45), 1);
  }
  for (const l of s.layers) {
    const off = t * l.speed;
    paint(rgb(l.color));
    g.beginPath();
    g.moveTo(0, VH);
    for (let x = 0; x <= VW; x += 2) {
      const wx = ((x + off) % VW + VW) % VW;
      const y = l.base - (ridge(l.seed + wx * l.freq, 1, 4) * 0.5 + 0.5) * l.amp;
      g.lineTo(x, y | 0);
    }
    g.lineTo(VW, VH); g.closePath(); g.fill();
    if (l.speed === 7) {
      for (const tr of s.trees) {
        if (tr.layer !== 1) continue;
        const x = ((tr.x - off) % (VW + 20) + VW + 20) % (VW + 20) - 10;
        const base = l.base + 4;
        rect(x, base - tr.h, 2, tr.h, rgb(mix(l.color, P.ink, 0.35)));
        rect(x - 3, base - tr.h, 8, 4, rgb(mix(l.color, P.ink, 0.2)));
      }
    }
  }
  for (const b of s.birds) {
    const x = ((b.x + t * (6 + b.s * 2)) % (VW + 30) + VW + 30) % (VW + 30) - 15;
    const flap = Math.sin(t * 6 + b.p) > 0;
    const c = rgb(mix(P.ink, P.sky[1], 0.3));
    rect(x, b.y, b.s * 3, 1, c);
    rect(x - b.s, b.y + (flap ? -1 : 1), b.s, 1, c);
    rect(x + b.s * 3, b.y + (flap ? -1 : 1), b.s, 1, c);
  }
}

// --- RPG: вид сверху, деревня, фонари, дорожка, идущий герой
function buildRpg(r, P) {
  const houses = Array.from({ length: rndInt(r, 5, 7) }, (_, i) => ({
    x: 20 + i * 40 + rndRange(r, -6, 6), y: rndRange(r, 46, 96),
    w: rndInt(r, 22, 30), h: rndInt(r, 16, 22), roof: mix(P.accent, P.ink, rndRange(r, 0.35, 0.6)),
    win: r() < 0.7,
  }));
  return {
    houses,
    trees: Array.from({ length: 22 }, () => ({ x: r() * VW, y: rndRange(r, 30, VH - 10), s: rndRange(r, 4, 8) })),
    lamps: Array.from({ length: 5 }, (_, i) => ({ x: 14 + i * 62, y: 120 + rndRange(r, -6, 6), p: r() * 6 })),
    walker: { x: 0, phase: 0 },
  };
}
function drawRpg(s, P, t) {
  rect(0, 0, VW, VH, rgb(mix(P.sky[1], P.ink, 0.45)));
  const dirt = rgb(mix(P.sky[1], P.ink, 0.32));      // трава в крапинку
  for (let y = 30; y < VH; y += 5) ditherFill(0, y, VW, 1, dirt, (y / 5) & 1);
  const roadY = 122;
  ditherFill(0, roadY - 5, VW, 14, rgb(mix(P.sky[2], P.ink, 0.25)), 0);
  rect(0, roadY - 1, VW, 1, rgb(mix(P.sky[2], P.ink, 0.12)));
  for (const tr of s.trees) {
    rect(tr.x - 1, tr.y - tr.s, 2, tr.s, rgb(mix(P.ink, P.sky[1], 0.25)));
    const sway = Math.sin(t * 0.8 + tr.x) * 0.8;
    rect(tr.x - tr.s * 0.5 + sway, tr.y - tr.s - 5, tr.s, 5, rgb(mix(P.ink, P.sky[1], 0.35)));
  }
  for (const h of s.houses) {
    rect(h.x, h.y + 4, h.w, h.h, rgb(mix(P.sky[1], P.ink, 0.55)));
    paint(rgb(h.roof));
    g.beginPath();
    g.moveTo(h.x - 2, h.y + 6);
    g.lineTo(h.x + h.w / 2, h.y - 4);
    g.lineTo(h.x + h.w + 2, h.y + 6);
    g.closePath(); g.fill();
    rect(h.x + 3, h.y + h.h - 4, 1, 1, rgb(mix(P.ink, P.sky[1], 0.2)));
    if (h.win) {
      const warm = Math.sin(t * 1.7 + h.x) > 0 ? P.light : P.light * 0.7;
      rect(h.x + 5, h.y + 10, 4, 4, rgba(mix(P.accent, [255, 214, 150], 0.6), warm > 170 ? 0.9 : 0.5));
    }
  }
  for (const l of s.lamps) {
    const flick = 0.6 + 0.4 * Math.abs(Math.sin(t * 3.1 + l.p));
    glow(l.x, l.y - 12, 9, rgba(P.accent, 0.32 * flick), 1);
    rect(l.x, l.y - 13, 1, 13, rgb(mix(P.ink, P.sky[1], 0.3)));
    rect(l.x - 2, l.y - 15, 5, 3, rgb(mix(P.accent, [255, 224, 170], 0.5)));
  }
  s.walker.x = ((t * 7) % (VW + 40)) - 20;
  const wy = roadY + 6;
  const step = Math.floor(t * 6) % 2;
  const body = rgb(mix(P.accent, P.ink, 0.25));
  rect(s.walker.x, wy - 9, 4, 7, body);
  rect(s.walker.x + 1, wy - 11, 3, 3, rgb(mix(P.sun, P.ink, 0.35)));
  rect(s.walker.x + (step ? 0 : 1), wy - 2, 1, 2, rgb(mix(P.ink, body, 0.3)));
  rect(s.walker.x + (step ? 3 : 2), wy - 2, 1, 2, rgb(mix(P.ink, body, 0.3)));
}

// --- космос: звёзды, планета с кольцом, астероиды, далёкий корабль
function buildSpace(r, P) {
  return {
    stars: Array.from({ length: 90 }, () => ({
      x: r() * VW, y: r() * VH, s: r() < 0.85 ? 1 : 2, p: r() * 6.28,
      l: rndRange(r, 0.4, 1),
    })),
    dust: Array.from({ length: 26 }, () => ({ x: r() * VW, y: r() * VH, s: rndRange(r, 1, 3), v: rndRange(r, 2, 6) })),
    rocks: Array.from({ length: 6 }, () => ({ x: r() * VW, y: r() * VH, s: rndRange(r, 3, 7), v: rndRange(r, 3, 9), sp: r() * 6 })),
    planet: { x: rndRange(r, 190, 280), y: rndRange(r, 34, 62), rr: rndRange(r, 18, 26), ring: r() < 0.6 },
    ship: { x: 0 },
    meteor: { t: -10, x: 0, y: 0, active: false },
  };
}
function drawSpace(s, P, t) {
  rect(0, 0, VW, VH, rgb(mix(P.ink, P.sky[0], 0.25)));
  // туманность
  for (let i = 0; i < 3; i++) {
    glow(60 + i * 80 + Math.sin(t * 0.1 + i) * 4, 50 + i * 22, 30, rgba(mix(P.glow, P.accent, 0.4), 0.05), 1);
  }
  for (const st of s.stars) {
    const tw = 0.55 + 0.45 * Math.sin(t * 1.6 + st.p);
    rect(st.x, st.y, st.s, st.s, rgba(mix(P.sun, P.accent, 0.3), st.l * tw));
  }
  for (const d of s.dust) {
    const x = ((d.x + t * d.v) % (VW + 10) + VW + 10) % (VW + 10) - 5;
    rect(x, d.y, d.s, 1, rgba(P.accent, 0.35));
  }
  const pl = s.planet;
  if (pl.ring) {
    g.globalAlpha = 0.35;
    g.strokeStyle = rgb(mix(P.accent, P.ink, 0.2));
    g.lineWidth = 2;
    g.beginPath(); g.ellipse(pl.x, pl.y + 2, pl.rr * 1.65, pl.rr * 0.42, -0.35, 0, Math.PI * 2); g.stroke();
    g.globalAlpha = 1;
  }
  const lit = mix(P.sun, P.accent, 0.15);
  const dark = mix(P.ink, P.sky[0], 0.3);
  for (let y = -pl.rr; y <= pl.rr; y++) {
    const dx = Math.sqrt(Math.max(0, pl.rr * pl.rr - y * y)) | 0;
    const k = 1 - (y + pl.rr) / (pl.rr * 2);
    rect(pl.x - dx, pl.y + y, dx * 2, 1, rgb(mix(dark, lit, 0.25 + k * 0.7)));
  }
  rect(pl.x - pl.rr * 0.5, pl.y - pl.rr * 0.3, pl.rr, 2, rgba(dark, 0.5));
  for (const rk of s.rocks) {
    const x = ((rk.x - t * rk.v) % (VW + 20) + VW + 20) % (VW + 20) - 10;
    const y = rk.y + Math.sin(t * 1.4 + rk.sp) * 2;
    rect(x, y, rk.s, rk.s * 0.7, rgb(mix(P.ink, P.sky[1], 0.35)));
    rect(x + 1, y + 1, rk.s - 2, 1, rgba(P.glow, 0.3));
  }
  if (!s.meteor.active && Math.random() < 0.0035) {
    s.meteor.active = true; s.meteor.t = 0; s.meteor.x = 30 + Math.random() * 200; s.meteor.y = 10 + Math.random() * 40;
  }
  if (s.meteor.active) {
    s.meteor.t += 1 / 30;
    const m = s.meteor;
    const x = m.x + m.t * 150, y = m.y + m.t * 80;
    for (let i = 0; i < 12; i++) rect(x - i * 1.6, y - i * 0.85, 2, 1, rgba(P.accent, 0.6 - i * 0.05));
    if (m.t > 1.6) m.active = false;
  }
  s.ship.x = ((t * 9) % (VW + 60)) - 30;
  const sh = rgb(mix(P.ink, P.sky[1], 0.5));
  rect(s.ship.x, 150, 7, 2, sh);
  rect(s.ship.x + 7, 150, 2, 1, sh);
  rect(s.ship.x - 2, 151, 2, 1, rgba(P.accent, 0.8));
}

// --- киберпанк: небоскрёбы, окна, неон, дождь, отражение в мокром асфальте
function buildCyber(r, P) {
  const mk = (base, hMin, hMax, count) => Array.from({ length: count }, (_, i) => ({
    x: i * (VW / count) + rndRange(r, -4, 4), w: rndRange(r, 14, 26),
    h: rndRange(r, hMin, hMax), base, seed: r(),
  }));
  return {
    far: mk(118, 40, 70, 14), mid: mk(132, 30, 62, 11),
    rain: Array.from({ length: 60 }, () => ({ x: r() * VW, y: r() * VH, v: rndRange(r, 90, 150), l: rndRange(r, 3, 7) })),
    signs: Array.from({ length: 7 }, () => ({
      x: r() * VW, y: rndRange(r, 70, 125), w: rndInt(r, 4, 9), p: r() * 6,
      c: [P.accent, mix(P.glow, [255, 200, 220], 0.4), mix(P.accent, [180, 255, 240], 0.4)][rndInt(r, 0, 2)],
    })),
    car: { x: -20, y: 150, v: rndRange(r, 30, 55) },
    lightning: { t: -20 },
  };
}
function drawCyber(s, P, t) {
  bandGradient(0, 120, [mix(P.sky[0], P.ink, 0.5), mix(P.sky[1], P.ink, 0.35), mix(P.sky[2], P.ink, 0.2)]);
  const drawTowers = (list, dim, offset, lit) => {
    for (const b of list) {
      const x = ((b.x + offset) % (VW + 40) + VW + 40) % (VW + 40) - 20;
      const top = b.base - b.h;
      rect(x, top, b.w, b.h + 20, rgb(mix(P.ink, dim, 0.4)));
      if (lit) {
        for (let wy = top + 3; wy < b.base - 2; wy += 4) {
          for (let wx = x + 2; wx < x + b.w - 2; wx += 3) {
            if (hash1(b.seed * 1000 + wy * 7 + wx) > 0.35) {
              const warm = hash1(wy * 3 + wx) > 0.2;
              rect(wx, wy, 1, 2, rgba(warm ? mix(P.accent, [255, 210, 160], 0.5) : P.glow, 0.55));
            }
          }
        }
      }
    }
  };
  drawTowers(s.far, mix(P.sky[1], P.ink, 0.6), -t * 1.5, false);
  drawTowers(s.mid, mix(P.sky[1], P.ink, 0.35), -t * 4, true);
  for (const sg of s.signs) {
    const blink = Math.sin(t * 2.2 + sg.p) > -0.55;
    if (!blink) continue;
    const x = ((sg.x - t * 4) % (VW + 30) + VW + 30) % (VW + 30) - 15;
    glow(x, sg.y, 10, rgba(sg.c, 0.22), 1);
    rect(x, sg.y, sg.w, 3, rgba(sg.c, 0.9));
    rect(x - 1, sg.y - 1, sg.w + 2, 5, rgba(sg.c, 0.25));
  }
  // мокрый асфальт
  const streetY = 138;
  rect(0, streetY, VW, VH - streetY, rgb(mix(P.ink, P.sky[0], 0.18)));
  g.globalAlpha = 0.22;
  g.save();
  g.translate(0, streetY * 2);
  g.scale(1, -1);
  for (const b of s.mid) {
    const x = ((b.x - t * 4) % (VW + 40) + VW + 40) % (VW + 40) - 20;
    rect(x, b.base - b.h, b.w, b.h, rgb(mix(P.ink, P.sky[1], 0.3)));
  }
  g.restore(); resetPaint();
  g.globalAlpha = 1;
  for (const sg of s.signs) {
    const x = ((sg.x - t * 4) % (VW + 30) + VW + 30) % (VW + 30) - 15;
    if (Math.sin(t * 2.2 + sg.p) > -0.55) rect(x, streetY + 2, sg.w, 1, rgba(sg.c, 0.35));
  }
  s.car.x += 1 / 30 * s.car.v;
  if (s.car.x > VW + 30) s.car.x = -30;
  rect(s.car.x, s.car.y, 8, 2, rgb(mix(P.ink, P.accent, 0.3)));
  rect(s.car.x + 8, s.car.y, 2, 1, rgba(P.accent, 0.95));
  rect(s.car.x - 2, s.car.y, 2, 1, rgba([255, 150, 130], 0.8));
  for (const r of s.rain) {
    r.y += r.v / 30;
    if (r.y > VH) { r.y = -4; r.x = Math.random() * VW; }
    rect(r.x, r.y, 1, r.l, rgba(P.glow, 0.35));
  }
  if (Math.random() < 0.0016) s.lightning.t = t;
  if (t - s.lightning.t < 0.12) {
    g.globalAlpha = 0.5; paint(rgb(mix(P.sky[2], [255, 255, 255], 0.4)));
    g.fillRect(0, 0, VW, 120); g.globalAlpha = 1;
  }
}

// --- подземелье: кладка, арки, факелы, капли, сундук
function buildDungeon(r, P) {
  return {
    bricks: Array.from({ length: 26 * 12 }, (_, i) => ({
      x: (i % 26) * 12 + ((Math.floor(i / 26) % 2) * 6), y: Math.floor(i / 26) * 12,
      s: hash1(i * 7 + 3),
    })),
    torches: Array.from({ length: 3 }, (_, i) => ({ x: 52 + i * 108, y: 66, p: r() * 6 })),
    drops: Array.from({ length: 6 }, () => ({ x: r() * VW, y: r() * VH, v: rndRange(r, 20, 50) })),
    chest: { x: rndRange(r, 190, 250), y: 150 },
  };
}
function drawDungeon(s, P, t) {
  rect(0, 0, VW, VH, rgb(mix(P.ink, P.sky[0], 0.22)));
  for (const b of s.bricks) {
    const shade = 0.5 + b.s * 0.5;
    rect(b.x, b.y, 11, 11, rgb(mix(P.ink, mix(P.sky[2], P.ink, 0.5), 0.25 + shade * 0.35)));
    rect(b.x, b.y + 10, 11, 1, rgba(P.ink, 0.7));
    rect(b.x + 10, b.y, 1, 11, rgba(P.ink, 0.5));
  }
  // арки
  for (let i = 0; i < 2; i++) {
    const ax = 96 + i * 120, aw = 26, ah = 46;
    for (let y = 0; y < ah; y++) {
      const k = y / ah;
      const dx = Math.round(aw * (0.5 + 0.5 * Math.cos((1 - k) * Math.PI * 0.5)));
      rect(ax - dx, 120 - ah + y, 3, 1, rgb(mix(P.ink, P.sky[1], 0.3)));
      rect(ax + dx - 3, 120 - ah + y, 3, 1, rgb(mix(P.ink, P.sky[1], 0.3)));
    }
    rect(ax - aw, 118, aw * 2, 2, rgb(mix(P.ink, P.sky[1], 0.2)));
  }
  rect(0, 120, VW, VH - 120, rgb(mix(P.ink, P.sky[1], 0.2)));
  for (const tt of s.torches) {
    const fl = 0.55 + 0.45 * Math.abs(Math.sin(t * 9 + tt.p));
    glow(tt.x, tt.y, 22, rgba(mix(P.accent, [255, 170, 90], 0.5), 0.18 * fl), 1);
    rect(tt.x - 1, tt.y - 8, 2, 8, rgb(mix(P.ink, P.sky[1], 0.35)));
    rect(tt.x - 1, tt.y - 12, 3, 4, rgba(mix(P.accent, [255, 210, 140], 0.6), fl));
  }
  for (const d of s.drops) {
    d.y += d.v / 30;
    if (d.y > 120) { d.y = 0; d.x = Math.random() * VW; }
    rect(d.x, d.y, 1, 2, rgba(P.glow, 0.4));
  }
  const c = s.chest;
  rect(c.x, c.y, 14, 9, rgb(mix(P.sky[1], P.ink, 0.5)));
  rect(c.x, c.y - 1, 14, 3, rgb(mix(P.accent, P.ink, 0.45)));
  rect(c.x + 6, c.y + 3, 2, 3, rgba(P.accent, 0.85));
}

// --- под водой: лучи, водоросли, пузыри, рыбы, дно
function buildUnderwater(r, P) {
  return {
    weed: Array.from({ length: 16 }, () => ({ x: r() * VW, h: rndRange(r, 24, 60), p: r() * 6, w: rndRange(r, 1, 2) })),
    fish: Array.from({ length: 5 }, () => ({ x: r() * VW, y: rndRange(r, 40, 120), v: rndRange(r, 6, 16), s: rndRange(r, 2, 4), p: r() * 6 })),
    bubbles: Array.from({ length: 14 }, () => ({ x: r() * VW, y: r() * VH, v: rndRange(r, 8, 22), s: r() < 0.7 ? 1 : 2 })),
    pebbles: Array.from({ length: 30 }, () => ({ x: r() * VW, y: VH - rndRange(r, 2, 12), s: rndRange(r, 1, 3) })),
  };
}
function drawUnderwater(s, P, t) {
  bandGradient(0, VH, [mix(P.sky[0], P.ink, 0.35), mix(P.sky[1], P.ink, 0.5), mix(P.ink, P.sky[0], 0.35)]);
  g.save();
  g.globalAlpha = 0.16;
  for (let i = 0; i < 5; i++) {
    const x = 30 + i * 66 + Math.sin(t * 0.25 + i) * 8;
    for (let y = 0; y < 150; y += 2) {
      const w = 9 + y * 0.14;
      rect(x - w / 2 + Math.sin(y * 0.05 + t) * 3, y, w, 1, rgb(mix(P.glow, P.sun, 0.4)));
    }
  }
  g.restore(); resetPaint();
  for (const w of s.weed) {
    for (let y = 0; y < w.h; y++) {
      const sway = Math.sin(t * 1.1 + w.p + y * 0.09) * (y / w.h) * 7;
      rect(w.x + sway, VH - 8 - y, w.w, 1, rgb(mix(P.ink, mix(P.accent, P.glow, 0.4), 0.35 + y / w.h * 0.3)));
    }
  }
  rect(0, VH - 9, VW, 9, rgb(mix(P.sky[2], P.ink, 0.55)));
  for (const p of s.pebbles) rect(p.x, p.y, p.s, 1, rgb(mix(P.sky[2], P.ink, 0.4)));
  for (const f of s.fish) {
    f.x += f.v / 30;
    if (f.x > VW + 12) { f.x = -12; f.y = 40 + Math.random() * 80; }
    const body = rgb(mix(P.ink, P.accent, 0.35));
    rect(f.x, f.y, f.s * 2, f.s, body);
    rect(f.x - f.s, f.y + (Math.sin(t * 4 + f.p) > 0 ? 0 : 1), f.s, 1, body);
  }
  for (const b of s.bubbles) {
    b.y -= b.v / 30;
    if (b.y < -4) { b.y = VH + 2; b.x = Math.random() * VW; }
    rect(b.x + Math.sin(b.y * 0.2) * 2, b.y, b.s, b.s, rgba(P.sun, 0.35));
  }
}

// --- retro racer / vapor: сетка, солнце, пальмы, полосы VHS
function buildVapor(r, P) {
  return {
    palms: Array.from({ length: 5 }, (_, i) => ({ x: 24 + i * 68 + rndRange(r, -10, 10), h: rndRange(r, 22, 38), p: r() * 6 })),
    sunY: rndRange(r, 52, 74),
    band: 0,
  };
}
function drawVapor(s, P, t) {
  bandGradient(0, 96, [mix(P.sky[0], P.ink, 0.25), mix(P.sky[1], P.accent, 0.25), mix(P.sky[2], P.accent, 0.35)]);
  // солнце с полосами
  const sx = 232, sy = s.sunY, r = 30;
  for (let y = -r; y <= r; y++) {
    const dx = Math.sqrt(Math.max(0, r * r - y * y)) | 0;
    const cut = y > r * 0.25 && (y % 5 < 2);
    if (cut) continue;
    rect(sx - dx, sy + y, dx * 2, 1, rgb(mix(P.accent, [255, 210, 150], 0.45)));
  }
  glow(sx, sy, 42, rgba(mix(P.accent, [255, 180, 140], 0.4), 0.12), 1);
  // дальние горы
  silhouette(11, 96, 22, 0.012, rgb(mix(P.ink, P.sky[1], 0.4)), 2);
  // сетка
  const horizon = 96;
  rect(0, horizon, VW, VH - horizon, rgb(mix(P.ink, P.sky[0], 0.3)));
  g.strokeStyle = rgba(mix(P.accent, P.glow, 0.5), 0.45);
  g.lineWidth = 1;
  for (let i = -10; i <= 10; i++) {
    g.beginPath();
    g.moveTo(160 + i * 6, horizon);
    g.lineTo(160 + i * 60, VH);
    g.stroke();
  }
  const scroll = (t * 0.35) % 1;
  for (let i = 0; i < 12; i++) {
    const k = (i + scroll) / 12;
    const y = horizon + Math.pow(k, 1.9) * (VH - horizon);
    g.beginPath(); g.moveTo(0, y | 0); g.lineTo(VW, y | 0); g.stroke();
  }
  for (const p of s.palms) {
    const sway = Math.sin(t * 0.9 + p.p) * 1.5;
    for (let y = 0; y < p.h; y++) rect(p.x + sway * (y / p.h) * 0.6, 96 - y, 2, 1, rgb(mix(P.ink, P.accent, 0.25)));
    for (let a = 0; a < 5; a++) {
      const ang = Math.PI + a * 0.42;
      for (let l = 0; l < 8; l++) {
        rect(p.x + 1 + Math.cos(ang) * l, 96 - p.h + Math.sin(ang) * l * 0.5, 1, 1, rgb(mix(P.ink, P.accent, 0.3)));
      }
    }
  }
  s.band = (s.band + 0.4) % VH;
  rect(0, s.band | 0, VW, 3, rgba(P.sun, 0.05));
}

// --- зима: снег, ели, дом с тёплым окном, дым
function buildSnow(r, P) {
  return {
    trees: Array.from({ length: 16 }, () => ({ x: r() * VW, y: rndRange(r, 96, 138), h: rndRange(r, 16, 34) })),
    snow: Array.from({ length: 70 }, () => ({ x: r() * VW, y: r() * VH, v: rndRange(r, 8, 22), d: rndRange(r, -6, 6), s: r() < 0.8 ? 1 : 2 })),
    cabin: { x: 214, y: 116 },
    smoke: Array.from({ length: 7 }, (_, i) => ({ p: i * 0.7 })),
  };
}
function drawSnow(s, P, t) {
  bandGradient(0, 120, [mix(P.sky[0], P.ink, 0.2), mix(P.sky[1], P.ink, 0.15), mix(P.sky[2], P.ink, 0.1)]);
  glow(70, 60, 26, rgba(P.glow, 0.12), 1);
  silhouette(3, 128, 26, 0.010, rgb(mix(P.sky[2], P.ink, 0.28)), 2);
  silhouette(9, 150, 18, 0.015, rgb(mix(P.sky[2], P.ink, 0.12)), 2);
  for (const tr of s.trees) {
    const c = rgb(mix(P.ink, P.sky[2], 0.3));
    for (let i = 0; i < 3; i++) {
      const w = 11 - i * 3, y = tr.y - tr.h + i * (tr.h / 3.4);
      paint(c);
      g.beginPath();
      g.moveTo(tr.x, y);
      g.lineTo(tr.x - w / 2, y + tr.h / 2.6);
      g.lineTo(tr.x + w / 2, y + tr.h / 2.6);
      g.closePath(); g.fill();
    }
    rect(tr.x - 1, tr.y, 2, 4, rgb(mix(P.ink, P.sky[1], 0.25)));
    rect(tr.x - 3, tr.y - tr.h + 2, 6, 1, rgba(P.sun, 0.5));
  }
  const cb = s.cabin;
  rect(cb.x, cb.y, 40, 22, rgb(mix(P.sky[1], P.ink, 0.45)));
  paint(rgb(mix(P.ink, P.sky[2], 0.4)));
  g.beginPath();
  g.moveTo(cb.x - 4, cb.y + 1); g.lineTo(cb.x + 20, cb.y - 12); g.lineTo(cb.x + 44, cb.y + 1);
  g.closePath(); g.fill();
  rect(cb.x + 7, cb.y + 8, 7, 7, rgba(mix(P.accent, [255, 206, 140], 0.6), 0.92));
  glow(cb.x + 10, cb.y + 11, 12, rgba(mix(P.accent, [255, 200, 130], 0.5), 0.2), 1);
  rect(cb.x + 26, cb.y + 9, 6, 13, rgb(mix(P.ink, P.sky[1], 0.3)));
  for (const sm of s.smoke) {
    const ph = t * 0.4 + sm.p;
    const y = cb.y - 14 - (ph % 5) * 6;
    const x = cb.x + 30 + Math.sin(ph) * 5;
    rect(x, y, 2 + (ph % 3), 2, rgba(P.sky[2], 0.22));
  }
  for (const f of s.snow) {
    f.y += f.v / 30;
    f.x += Math.sin(t * 0.6 + f.y * 0.05) * f.d * 0.02;
    if (f.y > VH) { f.y = -2; f.x = Math.random() * VW; }
    rect(f.x, f.y, f.s, f.s, rgba(P.sun, 0.75));
  }
}

// --- абстрактная сцена: фигуры, орбиты, созвездия
function buildAbstract(r, P) {
  return {
    shapes: Array.from({ length: 7 }, () => ({
      x: r() * VW, y: r() * VH, s: rndRange(r, 6, 20), a: r() * 6.28, v: rndRange(r, 0.05, 0.24),
      k: rndInt(r, 0, 2), p: r() * 6,
    })),
    nodes: Array.from({ length: 16 }, () => ({ x: r() * VW, y: r() * VH, p: r() * 6 })),
  };
}
function drawAbstract(s, P, t) {
  rect(0, 0, VW, VH, rgb(mix(P.ink, P.sky[0], 0.4)));
  for (let y = 0; y < VH; y += 8) rect(0, y, VW, 1, rgba(P.sky[1], 0.05));
  // созвездие
  g.strokeStyle = rgba(P.glow, 0.28);
  g.lineWidth = 1;
  for (let i = 0; i < s.nodes.length; i++) {
    const a = s.nodes[i];
    const ax = a.x + Math.sin(t * 0.3 + a.p) * 4, ay = a.y + Math.cos(t * 0.25 + a.p) * 4;
    for (let j = i + 1; j < s.nodes.length; j++) {
      const b = s.nodes[j];
      const bx = b.x + Math.sin(t * 0.3 + b.p) * 4, by = b.y + Math.cos(t * 0.25 + b.p) * 4;
      if (Math.hypot(ax - bx, ay - by) < 42) { g.beginPath(); g.moveTo(ax, ay); g.lineTo(bx, by); g.stroke(); }
    }
    rect(ax, ay, 1, 1, rgba(P.sun, 0.8));
  }
  for (const sh of s.shapes) {
    sh.a += sh.v / 30;
    const x = sh.x + Math.cos(sh.a) * 12, y = sh.y + Math.sin(sh.a * 1.3) * 8;
    const c = rgba(mix(P.accent, P.glow, (Math.sin(t * 0.5 + sh.p) + 1) / 2), 0.5);
    if (sh.k === 0) {
      paint(c); g.fillRect(x, y, sh.s, sh.s);
      rect(x + 2, y + 2, sh.s - 4, sh.s - 4, rgb(mix(P.ink, P.sky[0], 0.4)));
    } else if (sh.k === 1) {
      paint(c);
      g.beginPath(); g.moveTo(x, y + sh.s); g.lineTo(x + sh.s / 2, y); g.lineTo(x + sh.s, y + sh.s);
      g.closePath(); g.fill();
    } else {
      g.strokeStyle = c; g.lineWidth = 1;
      g.beginPath(); g.arc(x, y, sh.s / 2, 0, Math.PI * 2); g.stroke();
    }
  }
}

// --- космический шутер: корабль, выстрелы, взрывы, тряска
function buildShooter(r, P) {
  return {
    stars: [
      { list: Array.from({ length: 54 }, () => ({ x: r() * VW, y: r() * VH })), v: 9 },
      { list: Array.from({ length: 26 }, () => ({ x: r() * VW, y: r() * VH })), v: 24 },
    ],
    planet: { x: rndRange(r, 206, 272), y: rndRange(r, 32, 58), rad: rndRange(r, 18, 27), p: r() * 6 },
    nebulae: Array.from({ length: 3 }, (_, i) => ({
      x: r() * VW, y: 20 + i * 46, w: rndRange(r, 70, 130), h: rndRange(r, 16, 30), s: rndRange(r, 3, 7),
    })),
    rocks: Array.from({ length: 9 }, () => ({
      x: rndRange(r, 40, VW + 90), y: rndRange(r, 22, VH - 46),
      s: rndRange(r, 4, 9), v: rndRange(r, 16, 34), p: r() * 6,
    })),
    foes: Array.from({ length: 3 }, () => ({
      x: rndRange(r, VW + 30, VW + 240), y: rndRange(r, 24, VH - 54), v: rndRange(r, 10, 20), p: r() * 6,
    })),
    bullets: [], enemyBullets: [], sparks: [], exhaust: [],
    playerY: VH * 0.52, fireAt: 0, foeFireAt: 0, hurt: 0, hits: 0,
  };
}
function drawShooter(s, P, t, dt) {
  rect(0, 0, VW, VH, rgb(mix(P.deep, P.sky[0], 0.16)));
  // туманности и далёкая планета: им нужен объём за спиной, иначе
  // космос выглядит пустым чёрным полем
  for (const n of s.nebulae) {
    const x = ((n.x - t * n.s) % (VW + n.w) + VW + n.w) % (VW + n.w) - n.w + n.w / 2;
    for (let dy = -n.h; dy <= n.h; dy += 2) {
      const k = 1 - (dy * dy) / (n.h * n.h);
      if (k <= 0) continue;
      const w = Math.round(n.w * 0.5 * Math.sqrt(k));
      ditherFill(x - w, n.y + dy, w * 2, 2, rgba(mix(P.glow, P.accent, 0.4), 0.14), dy & 2);
    }
    ditherFill(x - n.w * 0.2, n.y - 3, n.w * 0.4, 6, rgba(mix(P.accent, P.sun, 0.4), 0.12), 1);
  }
  const pl = s.planet;
  glow(pl.x, pl.y, pl.rad * 2.4, rgba(P.glow, 0.1), 1);
  const rx = pl.rad * 1.5, ry = pl.rad * 0.3;                   // кольцо позади планеты
  g.globalAlpha = 0.4;
  for (let x = -rx; x <= rx; x++) {
    const yy = Math.round(ry * Math.sqrt(Math.max(0, 1 - (x * x) / (rx * rx))));
    rect(pl.x + x, pl.y - yy, 1, 1, rgba(mix(P.sun, P.accent, 0.45), 0.6));
    rect(pl.x + x, pl.y + yy, 1, 1, rgba(mix(P.deep, P.accent, 0.4), 0.7));
  }
  g.globalAlpha = 1;
  for (let y = -pl.rad; y <= pl.rad; y++) {
    const dx = Math.sqrt(Math.max(0, pl.rad * pl.rad - y * y)) | 0;
    const lit = 0.42 - (y / pl.rad) * 0.36;
    rect(pl.x - dx, pl.y + y, dx * 2, 1, rgb(mix(P.deep, mix(P.accent, P.sun, 0.35), lit)));
  }
  for (const layer of s.stars) {
    for (const st of layer.list) {
      st.x -= layer.v * dt;
      if (st.x < -2) { st.x = VW + Math.random() * 8; st.y = Math.random() * VH; }
      rect(st.x, st.y, 1, 1, rgba(P.sun, layer.v > 15 ? 0.95 : 0.5));
    }
  }
  // астероиды: летят навстречу, освещены сверху светом планеты
  for (const rk of s.rocks) {
    rk.x -= rk.v * dt;
    if (rk.x < -18) { rk.x = VW + Math.random() * 60; rk.y = 20 + Math.random() * (VH - 70); rk.s = 5 + Math.random() * 8; }
    const wob = Math.sin(t * 2 + rk.p) * 1.5;
    for (let y = -rk.s; y <= rk.s; y++) {
      const dx = Math.sqrt(Math.max(0, rk.s * rk.s - y * y)) | 0;
      rect(rk.x - dx, rk.y + y + wob, dx * 2, 1, rgb(mix(P.deep, P.sky[1], 0.16)));
    }
    for (let y = -rk.s * 0.7; y <= -rk.s * 0.1; y++) {          // подсвеченный бок
      const dx = Math.sqrt(Math.max(0, rk.s * rk.s - y * y)) | 0;
      rect(rk.x - dx, rk.y + y + wob + 1, Math.max(1, dx * 0.5), 1, rgba(mix(P.accent, P.glow, 0.4), 0.35));
    }
    rect(rk.x - rk.s * 0.3, rk.y + rk.s * 0.2 + wob, 3, 2, rgba(P.deep, 0.8));   // кратеры
    rect(rk.x + rk.s * 0.2, rk.y - rk.s * 0.35 + wob, 2, 2, rgba(P.deep, 0.6));
  }
  // враги
  for (const f of s.foes) {
    f.x -= f.v * dt;
    const y = f.y + Math.sin(t * 1.6 + f.p) * 6;
    if (f.x < -24) { f.x = VW + 40 + Math.random() * 120; f.y = 24 + Math.random() * (VH - 60); }
    if (Math.random() < 0.4) s.exhaust.push({ x: f.x + 19, y: y + 6, life: 0.4, age: 0 });
    sprite(SPRITES.ship, f.x, y, {
      a: rgb(mix(P.deep, P.accent, 0.3)), e: rgb(mix(P.deep, [220, 120, 110], 0.4)),
      f: rgba(mix([255, 170, 150], P.accent, 0.3), 0.95),
    }, true, 2);
  }
  // игрок
  const py = s.playerY + Math.sin(t * 1.1) * 5;
  s.playerY = py;
  if (Math.random() < 0.7) s.exhaust.push({ x: 40, y: py + 9, life: 0.5, age: 0 });
  drift(s.exhaust, { vx: [-46, -20], vy: [-4, 4], fade: (p) => 1 - p.life / 0.5 }, dt, rgba(mix(P.accent, P.sun, 0.3), 0.55));
  s.exhaust = s.exhaust.filter((p) => { p.life -= dt; return p.life > 0; });
  if (s.fireAt > 0.06) glow(78, py + 7, 5, rgba(mix(P.sun, [255, 240, 200], 0.5), 0.4), 1);
  sprite(SPRITES.ship, 44, py, {
    a: rgb(mix(P.pale, P.sun, 0.35)), e: rgb(mix(P.accent, P.deep, 0.35)), f: rgba(P.sun, 0.95),
  }, false, 2);
  // стрельба и попадания
  s.fireAt -= dt;
  if (s.fireAt <= 0) { s.fireAt = 0.26; s.bullets.push({ x: 82, y: py + 7 }); }
  s.foeFireAt -= dt;
  if (s.foeFireAt <= 0 && s.foes.length) {
    s.foeFireAt = 1.3;
    const f = s.foes[Math.floor(Math.random() * s.foes.length)];
    s.enemyBullets.push({ x: f.x, y: f.y + 7 });
  }
  for (let i = s.bullets.length - 1; i >= 0; i--) {
    const b = s.bullets[i];
    b.x += 150 * dt;
    rect(b.x - 6, b.y, 6, 1, rgba(mix(P.sun, P.accent, 0.3), 0.4));
    rect(b.x, b.y, 5, 2, rgba(mix(P.sun, [255, 250, 230], 0.6), 0.98));
    if (b.x > VW + 6) { s.bullets.splice(i, 1); continue; }
    let hit = false;
    for (const rk of s.rocks) {
      if (Math.hypot(b.x - rk.x, b.y - rk.y) < rk.s + 2) {
        burst(s.sparks, rk.x, rk.y, 14, 52);
        popup('+' + (100 + Math.floor(Math.random() * 20) * 10), Math.max(6, rk.x - 8), rk.y - 6);
        rk.x = -20; hit = true; s.hits++;
        shake(0.5);
        break;
      }
    }
    for (const f of s.foes) {
      if (!hit && Math.abs(b.x - (f.x + 9)) < 14 && Math.abs(b.y - (f.y + 7)) < 8) {
        burst(s.sparks, f.x + 9, f.y + 7, 16, 58);
        popup('+250', f.x, f.y);
        f.x = VW + 60 + Math.random() * 140; hit = true; s.hits++;
        shake(0.7);
      }
    }
    if (hit) s.bullets.splice(i, 1);
  }
  for (let i = s.enemyBullets.length - 1; i >= 0; i--) {
    const b = s.enemyBullets[i];
    b.x -= 95 * dt;
    rect(b.x - 4, b.y, 10, 1, rgba([255, 150, 130], 0.35));
    rect(b.x, b.y, 4, 1, rgba(mix(mix(P.accent, [255, 160, 150], 0.5), P.sun, 0.3), 0.95));
    if (b.x < -6) { s.enemyBullets.splice(i, 1); continue; }
    if (Math.abs(b.x - 56) < 10 && Math.abs(b.y - (py + 7)) < 7) {
      burst(s.sparks, b.x, b.y, 10, 44);
      s.enemyBullets.splice(i, 1);
      s.hurt = 0.5; shake(0.9);
    }
  }
  stepBurst(s.sparks, dt, [
    rgb(mix(P.sun, [255, 248, 225], 0.6)),
    rgb(mix(P.accent, P.sun, 0.35)),
    rgba(P.accent, 0.5),
  ]);
  if (s.hurt > 0) {
    s.hurt -= dt;
    g.globalAlpha = 0.18 * s.hurt;
    paint(rgb([220, 120, 110]));
    g.fillRect(0, 0, VW, VH);
    g.globalAlpha = 1;
  }
}

// --- файтинг: двое, полоски здоровья, искры, нокдаун
function buildDuel(r, P) {
  return {
    a: { x: 128, hp: 100, arm: 0, hurt: 0 },
    b: { x: 196, hp: 100, arm: 0, hurt: 0 },
    next: 0.8, turn: 1, ko: 0, koAt: 0, round: 1,
    crowd: Array.from({ length: 30 }, () => ({ x: r() * VW, y: rndRange(r, 72, 84), s: rndRange(r, 2, 4), p: r() * 6 })),
    sparks: [],
    dust: particles(r, 20, { vx: [-3, 3], vy: [-6, -2], spanY: [110, 166], size: [1, 1] }),
  };
}
function drawDuel(s, P, t, dt) {
  // зал: тёмная стена, толпа силуэтами, яркий пол в пятне прожектора
  bandGradient(0, 88, [mix(P.deep, P.sky[0], 0.3), mix(P.deep, P.sky[1], 0.22), mix(P.ink, P.sky[2], 0.14)]);
  for (const c of s.crowd) {                       // толпа у стены
    const up = Math.sin(t * 2.4 + c.p) > 0.5 ? 2 : 0;
    rect(c.x, c.y - c.s * 2, c.s, c.s * 2, rgb(P.deep));
    rect(c.x, c.y - c.s * 2 - c.s, c.s, c.s, rgb(P.deep));
    if (up) rect(c.x - c.s, c.y - c.s * 2 - c.s, c.s, c.s, rgb(P.deep));
  }
  rect(0, 88, VW, VH - 88, rgb(mix(P.deep, P.sky[2], 0.3)));
  rect(0, 88, VW, 1, rgba(mix(P.accent, P.sun, 0.3), 0.5));
  // прожектор: бойцы стоят в свете
  paint(rgba(mix(P.sun, P.accent, 0.35), 0.07));
  g.beginPath();
  g.moveTo(VW / 2 - 7, 0); g.lineTo(VW / 2 + 7, 0);
  g.lineTo(VW / 2 + 82, VH); g.lineTo(VW / 2 - 82, VH);
  g.closePath(); g.fill();
  glow(VW / 2, 136, 56, rgba(mix(P.sun, P.accent, 0.4), 0.08), 1);
  drift(s.dust, { vx: [-2, 2], vy: [-5, -1], wobbleFreq: 1.6, wobble: 3, fade: () => 0.5 }, dt, rgba(P.sun, 0.18));

  // бой: удары по очереди, с промахами и отскоком
  if (!s.ko) {
    s.next -= dt;
    if (s.next <= 0) {
      s.next = 0.75 + Math.random() * 0.7;
      const atk = s.turn === 1 ? s.a : s.b;
      const def = s.turn === 1 ? s.b : s.a;
      const reach = Math.abs(atk.x - def.x) < 74;
      atk.arm = 1;
      if (reach) {
        def.hp -= 6 + Math.random() * 9;
        def.hurt = 0.4;
        const hx = (atk.x + def.x) / 2 + (s.turn === 1 ? 16 : -16);
        burst(s.sparks, hx, 118, 9, 44);
        shake(0.6);
        popup('HIT', hx - 8, 108);
      }
      if (def.hp <= 0) { s.ko = 1; s.koAt = t; popup('K.O.', 138, 92); shake(1.2); }
      s.turn = -s.turn;
    } else {
      s.a.arm = Math.min(1, s.a.arm + dt * 5);
      s.b.arm = Math.min(1, s.b.arm + dt * 5);
    }
    // лёгкая качка: бойцы сближаются и расходятся
    s.a.x = 128 + Math.sin(t * 1.4) * 5;
    s.b.x = 196 - Math.sin(t * 1.4 + 0.6) * 5;
  } else if (t - s.koAt > 3.4) {                   // новый раунд
    s.ko = 0; s.round++; s.a.hp = 100; s.b.hp = 100; s.next = 1;
  }
  // Боец собирается из частей: сначала тёмный контур, потом цвет.
  // Без контура фигурки сливаются с фоном — на этом всё и ломалось.
  const fighter = (f, face, body, skin, ko) => {
    const baseY = 138;
    const arm = f.arm * (ko ? 0 : 1);
    const lean = ko ? 6 : 0;
    const step = ko ? 0 : (Math.sin(t * 3 + f.x) > 0 ? 1 : 0);
    const ex = f.x + face * (4 + arm * 14);
    const parts = [
      [f.x - 4, baseY - 23 + lean, 9, 15, body],               // торс
      [f.x - 3, baseY - 31 + lean, 7, 7, skin],                // голова
      [f.x - 4, baseY - 8, 4, 8 - step, body],                 // ноги
      [f.x + 1, baseY - 8 + step, 4, 8 - step, body],
      [Math.min(f.x, ex), baseY - 21, Math.abs(ex - f.x) + 4, 4, body],
      [ex, baseY - 22, 5, 5, skin],
    ];
    rect(f.x - 8, baseY + 1, 16, 2, rgba(P.deep, 0.5));        // тень на полу
    for (const q of parts) rect(q[0] - 1, q[1] - 1, q[2] + 2, q[3] + 2, rgb(P.deep));
    for (const q of parts) rect(q[0], q[1], q[2], q[3], q[4]);
    rect(f.x + face * 2, baseY - 29 + lean, 1, 1, rgb(P.deep));// глаз
    if (f.hurt > 0) {
      g.globalAlpha = f.hurt * 0.75;
      rect(f.x - 5, baseY - 32, 11, 26, rgb([250, 220, 205]));
      g.globalAlpha = 1;
      f.hurt -= dt;
    }
  };
  const skinA = rgb(mix(P.sun, [255, 226, 196], 0.5));
  const skinB = rgb(mix(P.sun, P.accent, 0.2));
  fighter(s.a, 1, rgb(mix(P.pale, P.accent, 0.3)), skinA, s.a.hp <= 0);
  fighter(s.b, -1, rgb(mix(P.sky[2], P.accent, 0.45)), skinB, s.b.hp <= 0);
  stepBurst(s.sparks, dt, [
    rgb(mix(P.sun, [255, 245, 220], 0.6)), rgb(mix(P.accent, P.sun, 0.5)), rgba(P.glow, 0.55),
  ]);
  // канаты переднего плана: камера из зала
  for (let y = 166; y < VH; y += 5) rect(0, y, VW, 1, rgba(P.deep, 0.75));

  // классические полоски здоровья
  rect(8, 8, 120, 7, rgba(P.deep, 0.9));
  rect(9, 9, 118 * Math.max(0, s.a.hp) / 100, 5, rgba(mix(P.accent, [180, 240, 170], 0.5), 0.95));
  rect(VW - 128, 8, 120, 7, rgba(P.deep, 0.9));
  const wB = 118 * Math.max(0, s.b.hp) / 100;
  rect(VW - 9 - wB, 9, wB, 5, rgba(mix(P.accent, [240, 170, 160], 0.5), 0.95));
  text('YOU', 9, 18, rgba(P.sun, 0.85), 1);
  text('RIVAL', VW - 9 - textWidth('RIVAL', 1), 18, rgba(P.sun, 0.85), 1);
  text('ROUND ' + s.round, 138, 18, rgba(P.sun, 0.75), 1);
}

// --- дракон над замком: герой на скале, крылья, угли
function buildDragon(r, P) {
  return {
    stars: Array.from({ length: 70 }, () => ({ x: r() * VW, y: r() * VH * 0.7, p: r() * 6, s: r() < 0.85 ? 1 : 2 })),
    crag: Array.from({ length: 40 }, () => ({ x: r() * VW, h: rndRange(r, 6, 26), w: rndRange(r, 2, 6) })),
    dragon: { x: 240, y: 54, dir: -1, p: r() * 6, breath: 0 },
    hero: { x: 62, frame: 0 },
    embers: particles(r, 26, { vx: [-6, 6], vy: [-14, -5], size: [1, 1] }),
    moon: { x: rndRange(r, 40, 90), y: rndRange(r, 26, 44), r: rndRange(r, 12, 18) },
    fire: [],
  };
}
function drawDragon(s, P, t, dt) {
  bandGradient(0, 130, [mix(P.deep, P.sky[0], 0.34), mix(P.deep, P.sky[1], 0.24), mix(P.ink, P.sky[2], 0.12)]);
  for (const st of s.stars) {
    const tw = 0.5 + 0.5 * Math.sin(t * 1.4 + st.p);
    rect(st.x, st.y, st.s, st.s, rgba(P.sun, 0.8 * tw));
  }
  const m = s.moon;
  glow(m.x, m.y, m.r * 3, rgba(P.sun, 0.13), 1);
  for (let y = -m.r; y <= m.r; y++) {
    const dx = Math.sqrt(Math.max(0, m.r * m.r - y * y)) | 0;
    rect(m.x - dx, m.y + y, dx * 2, 1, rgb(mix(P.sun, [255, 250, 238], 0.7)));
  }
  silhouette(5, 130, 30, 0.009, rgb(mix(P.deep, P.sky[1], 0.22)), 2);
  silhouette(17, 146, 20, 0.014, rgb(mix(P.deep, P.sky[1], 0.08)), 2);
  // замок на дальнем утёсе
  const cx = 244, cy = 118;
  const stone = rgb(mix(P.deep, P.sky[1], 0.34));
  rect(cx, cy - 26, 30, 26, stone);
  for (let i = 0; i < 4; i++) rect(cx + 2 + i * 8, cy - 30, 4, 4, stone);
  rect(cx + 12, cy - 44, 8, 18, stone);
  rect(cx + 15, cy - 50, 3, 6, stone);
  const litWin = rgba(mix(P.accent, [255, 210, 140], 0.55), 0.9);
  rect(cx + 8, cy - 14, 3, 4, litWin);
  rect(cx + 22, cy - 20, 3, 4, litWin);
  if (Math.sin(t * 1.3) > -0.3) rect(cx + 16, cy - 40, 2, 3, litWin);

  // дракон: тело светлее неба, крылья как парус на луне — иначе
  // чёрное на чёрном не читается
  const d = s.dragon;
  d.x += d.dir * 7 * dt;
  if (d.x < 120) d.dir = 1;
  if (d.x > 300) d.dir = -1;
  d.y = 54 + Math.sin(t * 0.7 + d.p) * 8;
  const body = rgb(mix(P.accent, P.pale, 0.28));
  const dark = rgb(mix(P.deep, P.accent, 0.22));
  const flap = Math.sin(t * 3.4);
  for (let side = -1; side <= 1; side += 2) {      // два крыла: дальнее темнее
    const back = side < 0;
    paint(back
      ? rgba(mix(P.deep, P.accent, 0.3), 0.85)
      : rgba(mix(P.accent, P.sun, 0.4), 0.62));
    g.beginPath();
    g.moveTo(d.x, d.y + (back ? -2 : 0));
    g.lineTo(d.x - d.dir * (16 + (back ? 5 : 0)), d.y - 15 - flap * 13);
    g.lineTo(d.x - d.dir * (30 + (back ? 4 : 0)), d.y + 2 + flap * 7);
    g.lineTo(d.x - d.dir * 10, d.y + 5);
    g.closePath(); g.fill();
    for (let k = 1; k <= 3; k++) {                 // «пальцы» крыла
      paint(back ? rgb(P.deep) : rgba(mix(P.deep, P.accent, 0.35), 0.75));
      g.beginPath();
      g.moveTo(d.x - d.dir * 2, d.y + 1);
      g.lineTo(d.x - d.dir * (10 + k * 6), d.y - 12 - flap * (11 - k * 2) + k * 3);
      g.lineTo(d.x - d.dir * (11 + k * 6), d.y - 9 - flap * (10 - k * 2) + k * 3);
      g.closePath(); g.fill();
    }
  }
  for (let i = -8; i <= 8; i++) {                  // тело: спина светлая, брюхо тёмное
    const hh = Math.round(1 + (1 - (i * i) / 64) * 4);
    rect(d.x + d.dir * i, d.y - hh, 1, hh + 1, body);
    rect(d.x + d.dir * i, d.y + 1, 1, hh, dark);
  }
  for (let i = 1; i <= 20; i++) {                  // хвост волной
    const k = i / 20;
    const y = d.y + 2 + Math.sin(t * 2 + i * 0.35) * 3 * k;
    rect(d.x - d.dir * (8 + i), y, 1, Math.max(1, Math.round(3 * (1 - k))), body);
  }
  rect(d.x - d.dir * 30, d.y + 2 + Math.sin(t * 2 + 7) * 3, 2, 2, body);
  const nx = d.x + d.dir * 9, ny = d.y - 4;
  for (let i = 0; i < 6; i++) rect(d.x + d.dir * (5 + i * 2), d.y - 4 - i * 0.6, 2, 3, body);   // шея
  rect(nx, ny - 2, 7, 5, body);
  rect(nx + d.dir * 1, ny - 4, 3, 2, rgb(mix(P.accent, P.sun, 0.5)));     // рог
  rect(nx + d.dir * 4, ny - 1, 2, 2, rgb(mix([255, 210, 130], P.sun, 0.3)));
  d.breath -= dt;
  if (d.breath <= 0) { d.breath = 6 + Math.random() * 5; burst(s.fire, nx + d.dir * 6, ny + 1, 16, 34); }
  if (d.breath < 0.9) glow(nx + d.dir * 6, ny + 1, 9, rgba([255, 170, 90], 0.3), 1);
  stepBurst(s.fire, dt, [rgb(mix(P.sun, [255, 180, 100], 0.7)), rgb(mix(P.accent, [255, 140, 70], 0.55)), rgba([220, 110, 70], 0.45)]);

  for (const c of s.crag) rect(c.x, 176 - c.h, c.w, c.h + 4, rgb(mix(P.deep, P.sky[1], 0.06)));
  rect(0, 176, VW, VH - 176, rgb(P.deep));
  s.hero.frame = Math.floor(t * 1.6) % 2;
  sprite(s.hero.frame ? SPRITES.heroB : SPRITES.heroA, s.hero.x, 164,
    { a: rgb(mix(P.pale, P.sun, 0.3)), b: rgb(mix(P.accent, P.deep, 0.4)), c: rgb(P.deep), d: rgb(mix(P.sun, P.pale, 0.4)) }, false);
  drift(s.embers, { vx: [-4, 4], vy: [-16, -6], wobbleFreq: 2, wobble: 4, fade: (p) => 0.4 + 0.6 * Math.sin(NOW + p.p) }, dt,
    () => rgba(mix(P.accent, [255, 170, 90], 0.6), 0.7));
}

// --- остров: море, лодка, пальмы, отражение
function buildIsland(r, P) {
  return {
    waves: Array.from({ length: 30 }, (_, i) => ({ y: 103 + i * 3, len: rndRange(r, 8, 30), x: r() * VW, v: rndRange(r, 3, 10), a: rndRange(r, 0.16, 0.45) })),
    palms: Array.from({ length: 3 }, (_, i) => ({ x: 92 + i * 15 + rndRange(r, -4, 4), h: rndRange(r, 26, 40), p: r() * 6, lean: rndRange(r, -3, 3) })),
    boat: { x: -30, s: rndRange(r, 0.8, 1.2) },
    far: { x: rndRange(r, 40, 120), s: rndRange(r, 0.5, 0.8) },
    clouds: Array.from({ length: 4 }, () => ({ x: r() * VW, y: rndRange(r, 14, 52), w: rndRange(r, 30, 60), s: rndRange(r, 1, 3) })),
    birds: Array.from({ length: 3 }, () => ({ x: r() * VW, y: rndRange(r, 34, 64), p: r() * 6, v: rndRange(r, 6, 12) })),
    flies: particles(r, 16, { vx: [-4, 4], vy: [-3, 3], spanY: [130, 176], size: [1, 1] }),
    sparkle: particles(r, 24, { vx: [-3, 3], vy: [-1, 1], spanY: [110, 174], size: [1, 1] }),
    rocks: Array.from({ length: 7 }, (_, i) => ({ x: i * 46 + rndRange(r, -14, 14), w: rndRange(r, 20, 34), h: rndRange(r, 8, 16) })),
  };
}
function palm(x, baseY, h, sway, trunk, leaf) {
  const top = baseY - h;
  const ct = rgb(trunk), cl = rgb(leaf);
  for (let y = 0; y < h; y++) {                    // ствол с изгибом
    const k = y / h;
    rect(x + sway * k * k * 2, baseY - y, 2, 1, ct);
  }
  const tx = x + sway * 2, ty = top;
  for (let a = 0; a < 6; a++) {                    // листья двумя пикселями
    const ang = -0.25 - a * 0.5;
    for (let l = 2; l < 9; l++) {
      const px = tx + 1 + Math.cos(ang) * l * 1.15;
      const py = ty + Math.sin(ang) * l * 0.75 + l * l * 0.045;
      rect(px, py, 2, 2, cl);
    }
  }
  rect(tx - 2, ty - 1, 5, 2, cl);
  rect(tx + 1, ty + 1, 2, 2, rgb(mix(leaf, [70, 58, 36], 0.4)));
}
function drawIsland(s, P, t, dt) {
  // небо: тёплая дымка у горизонта, иначе рассвет выходит серым
  bandGradient(0, 103, [
    mix(P.sky[0], P.accent, 0.28),
    mix(P.sky[1], mix(P.accent, P.glow, 0.4), 0.32),
    mix(P.sky[2], [255, 236, 200], 0.42),
  ]);
  for (const c of s.clouds) {                      // облака дизерингом
    const x = ((c.x + t * c.s) % (VW + 90) + VW + 90) % (VW + 90) - 45;
    ditherFill(x, c.y, c.w, 4, rgba(mix(P.sun, P.sky[2], 0.5), 0.5), 0);
    ditherFill(x + 6, c.y - 4, c.w - 16, 4, rgba(mix(P.sun, P.sky[2], 0.4), 0.4), 1);
  }
  const sunX = 62, sunY = 76, sr = 17;
  glow(sunX, sunY, 46, rgba(mix(P.accent, P.sun, 0.5), 0.16), 1);
  for (let y = -sr; y <= sr; y++) {
    const dx = Math.sqrt(Math.max(0, sr * sr - y * y)) | 0;
    rect(sunX - dx, sunY + y, dx * 2, 1, rgb(mix(P.sun, [255, 224, 168], 0.5)));
  }
  silhouette(23, 103, 14, 0.010, rgb(mix(P.ink, P.sky[1], 0.5)), 2);
  // море: заметно темнее неба, иначе горизонт пропадает
  rect(0, 103, VW, VH - 103, rgb(mix(P.deep, P.sky[1], 0.34)));
  for (let y = 103; y < VH; y += 4) {              // вода светлеет к горизонту
    const k = 1 - (y - 103) / (VH - 103);
    ditherFill(0, y, VW, 4, rgba(mix(P.sky[1], P.accent, 0.3), 0.1 * k), 0);
  }
  rect(0, 103, VW, 1, rgba(mix(P.sun, P.accent, 0.4), 0.35));
  for (const w of s.waves) {
    w.x += w.v * dt;
    if (w.x > VW) w.x = -w.len;
    rect(w.x, w.y, w.len, 1, rgba(mix(P.sun, P.accent, 0.35), w.a * 0.9));
    rect(w.x + w.len * 0.4, w.y + 1, w.len * 0.4, 1, rgba(P.sun, w.a * 0.4));
  }
  // солнечная дорожка
  for (let i = 0; i < 16; i++) {
    const y = 104 + i * ((VH - 104) / 16);
    const len = (5 + Math.random() * 24) * (1 - i / 18);
    rect(sunX - len / 2, y, len, 1, rgba(mix(P.sun, P.accent, 0.25), 0.34 - i * 0.015));
  }
  // остров с пальмами: почти чёрный силуэт на свету
  const isle = mix(P.deep, P.sky[1], 0.12);
  silhouette(31, 116, 11, 0.03, isle, 1);
  for (const p of s.palms) {
    const sway = Math.sin(t * 0.9 + p.p) * 5 + p.lean;
    palm(p.x, 116, p.h, sway, rgb(mix(P.deep, P.sky[1], 0.2)), rgb(mix(P.deep, P.accent, 0.28)));
  }
  silhouette(37, 118, 6, 0.05, rgb(mix(P.deep, P.sky[1], 0.06)), 1);
  // дальняя лодка — для глубины
  s.far.x += 3 * s.far.s * dt;
  if (s.far.x > VW + 20) s.far.x = -20;
  g.globalAlpha = 0.55;
  sprite(SPRITES.boat, s.far.x, 96, { b: rgb(mix(P.deep, P.sky[1], 0.15)), d: rgba(P.sun, 0.7) }, false, s.far.s);
  g.globalAlpha = 1;
  // лодка с отражением
  s.boat.x += 7 * s.boat.s * dt;
  if (s.boat.x > VW + 30) s.boat.x = -30;
  const by = 97 + Math.sin(t * 1.6) * 1.5;
  g.globalAlpha = 0.22;
  sprite(SPRITES.boat, s.boat.x, by + 15, { b: rgb(mix(P.deep, P.sky[1], 0.2)), d: rgba(P.sun, 0.7) }, false);
  g.globalAlpha = 1;
  sprite(SPRITES.boat, s.boat.x, by, {
    b: rgb(mix(P.deep, P.accent, 0.22)), d: rgb(mix(P.pale, P.sun, 0.4)),
  }, false);
  rect(s.boat.x - 2, by + 13, 11, 1, rgba(P.sun, 0.16));
  for (const b of s.birds) {
    b.x += b.v * dt;
    if (b.x > VW + 10) b.x = -10;
    const flap = Math.sin(t * 5 + b.p) > 0;
    sprite(flap ? SPRITES.birdA : SPRITES.birdB, b.x, b.y + Math.sin(t * 1.2 + b.p) * 3,
      { a: rgba(mix(P.deep, P.sky[1], 0.2), 0.9) }, false);
  }
  drift(s.sparkle, { vx: [-3, 3], vy: [-1, 1], wobbleFreq: 2.2, wobble: 3, fade: (p) => 0.3 + 0.4 * Math.sin(NOW * 2 + p.p) }, dt, rgba(mix(P.sun, P.accent, 0.3), 0.5));
  if (P.time === 'ночь') {
    drift(s.flies, { vx: [-5, 5], vy: [-3, 3], wobbleFreq: 3, wobble: 6, fade: (p) => 0.4 + 0.6 * Math.abs(Math.sin(NOW * 1.6 + p.p)) }, dt,
      () => rgba(mix(P.accent, [255, 240, 180], 0.5), 0.85));
  }
  // передний план: камни, чтобы кадр не был плоским
  for (const rk of s.rocks) {
    paint(rgb(mix(P.deep, P.sky[1], 0.05)));
    g.beginPath();
    g.moveTo(rk.x, VH);
    g.lineTo(rk.x + rk.w * 0.15, VH - rk.h);
    g.lineTo(rk.x + rk.w * 0.7, VH - rk.h * 0.6);
    g.lineTo(rk.x + rk.w, VH);
    g.closePath(); g.fill();
  }
}

// --- поезд: вид из вагона, за окном бегут поля
function buildTrain(r, P) {
  return {
    layers: [0, 1, 2].map((i) => ({
      speed: [9, 24, 52][i], base: [58, 72, 86][i], amp: [16, 11, 7][i],
      freq: [0.011, 0.019, 0.03][i], seed: r() * 400,
      color: mix(P.sky[2], P.ink, [0.22, 0.48, 0.74][i]),
    })),
    towers: Array.from({ length: 5 }, (_, i) => ({ x: i * 70 + r() * 40, h: rndRange(r, 12, 30) })),
    lights: Array.from({ length: 16 }, () => ({ x: r() * VW, y: rndRange(r, 58, 80) })),
    poles: Array.from({ length: 3 }, (_, i) => ({ x: -30 - i * 96 })),
    steam: [],
    cup: { x: 202, y: 108 },
  };
}
function drawTrain(s, P, t, dt) {
  rect(0, 0, VW, VH, rgb(mix(P.deep, P.accent, 0.16)));
  rect(0, 0, VW, 20, rgb(mix(P.deep, P.ink, 0.42)));          // потолок
  rect(0, 19, VW, 1, rgba(mix(P.sun, P.accent, 0.35), 0.3));
  rect(58, 9, 204, 2, rgb(mix(P.deep, P.sun, 0.16)));         // багажная полка
  for (const x of [80, 152, 224]) {
    rect(x, 11, 1, 6, rgba(P.deep, 0.6));
    rect(x - 4, 17, 9, 3, rgb(mix(P.deep, P.accent, 0.22)));
  }
  const WX = 44, WY = 20, WW = 232, WH = 82;
  g.save();
  g.beginPath(); g.rect(WX, WY, WW, WH); g.clip();
  bandGradient(WY, 60, [P.sky[0], P.sky[1], P.sky[2]]);
  for (const l of s.lights) {                                  // далёкие огни
    l.x -= 3 * dt;
    if (l.x < WX - 4) l.x = WX + WW + 4;
    rect(l.x, l.y, 1, 1, rgba(mix(P.sun, [255, 220, 160], 0.4), 0.6));
  }
  for (const tw of s.towers) {                                 // дальние домики
    tw.x -= 11 * dt;
    if (tw.x < WX - 30) tw.x = WX + WW + 20;
    rect(tw.x, 86 - tw.h, 8, tw.h, rgb(mix(P.deep, P.sky[1], 0.25)));
    rect(tw.x + 9, 86 - tw.h * 0.6, 5, tw.h * 0.6, rgb(mix(P.deep, P.sky[1], 0.3)));
  }
  for (const l of s.layers) {
    const off = t * l.speed;
    paint(rgb(l.color));
    g.beginPath();
    g.moveTo(WX, 96);
    for (let x = 0; x <= WW; x += 3) {
      const wx = ((x + off) % 240 + 240) % 240;
      g.lineTo(WX + x, l.base - (ridge(l.seed + wx * l.freq, 1, 4) * 0.5 + 0.5) * l.amp);
    }
    g.lineTo(WX + WW, 96); g.closePath(); g.fill();
    for (let y = l.base + 2; y < 96; y += 3) {                 // борозды поля
      const px = ((y * 7 + off * 0.4) % 12);
      ditherFill(WX + px, y, WW, 1, rgba(mix(l.color, P.ink, 0.35), 0.4), 0);
    }
  }
  for (const p of s.poles) {                                   // столбы у путей
    p.x -= 168 * dt;
    if (p.x < WX - 12) p.x += 288;
    rect(p.x, 40, 2, 56, rgb(mix(P.deep, P.ink, 0.3)));
    rect(p.x - 6, 38, 14, 2, rgb(mix(P.deep, P.ink, 0.3)));
  }
  g.globalAlpha = 0.12;                                        // отсвет на стекле
  ditherFill(WX, WY, WW, WH, rgb([255, 250, 240]), 0);
  g.globalAlpha = 1;
  g.restore(); resetPaint();
  rect(WX - 2, WY - 2, WW + 4, 3, rgb(mix(P.deep, P.sun, 0.22)));   // рама
  rect(WX - 2, WY + WH - 1, WW + 4, 3, rgb(mix(P.deep, P.sun, 0.18)));
  rect(WX - 3, WY, 3, WH, rgb(mix(P.deep, P.sun, 0.2)));
  rect(WX + WW, WY, 3, WH, rgb(mix(P.deep, P.sun, 0.2)));
  // занавеска
  for (let x = 36; x < 50; x += 3) rect(x, 22, 2, 84, rgba(mix(P.accent, P.deep, 0.5), 0.5));
  for (let x = 270; x < 284; x += 3) rect(x, 22, 2, 84, rgba(mix(P.accent, P.deep, 0.5), 0.4));
  // столик и чай
  rect(0, 118, VW, 3, rgb(mix(P.deep, P.sun, 0.24)));
  rect(0, 121, VW, VH - 121, rgb(mix(P.deep, P.accent, 0.1)));
  rect(148, 108, 26, 10, rgb(mix(P.pale, P.sky[2], 0.35)));       // блокнот
  rect(152, 111, 18, 1, rgba(P.deep, 0.4));
  rect(152, 114, 14, 1, rgba(P.deep, 0.3));
  rect(112, 110, 14, 8, rgb(mix(P.deep, P.sky[1], 0.3)));         // плеер
  rect(116, 113, 2, 2, rgba(P.accent, 0.8));
  rect(121, 113, 2, 2, rgba(P.accent, 0.8));
  const cp = s.cup;
  rect(cp.x, cp.y, 9, 9, rgb(mix(P.pale, P.sky[2], 0.45)));
  rect(cp.x, cp.y, 9, 2, rgb(mix(P.pale, P.sun, 0.3)));
  rect(cp.x + 9, cp.y + 3, 2, 3, rgb(mix(P.pale, P.sky[2], 0.45)));
  rect(cp.x - 4, cp.y + 9, 17, 2, rgb(mix(P.deep, P.sun, 0.2)));
  if (Math.random() < 0.5) s.steam.push({ x: cp.x + 4, y: cp.y - 1, life: 1.2, age: 0 });
  drift(s.steam, { vx: [-3, 3], vy: [-11, -6], wobbleFreq: 2, wobble: 3, fade: (p) => 1 - p.age / p.life }, dt, rgba(P.pale, 0.25));
  s.steam = s.steam.filter((p) => { p.age += dt; return p.age < p.life; });
}

// --- пустыня: дюны, караван, обелиск, зной
function buildDesert(r, P) {
  return {
    dunes: [0, 1, 2].map((i) => ({
      base: [92, 114, 140][i], amp: [24, 19, 15][i], freq: [0.006, 0.011, 0.017][i],
      seed: r() * 500, speed: [1.6, 4.5, 10][i],
      color: mix(P.sky[2], P.ink, [0.22, 0.48, 0.74][i]),
    })),
    caravan: { x: 330, speed: 13 },
    monolith: { x: rndRange(r, 40, 90), h: rndRange(r, 30, 46) },
    vultures: Array.from({ length: 2 }, () => ({ x: r() * VW, y: rndRange(r, 26, 52), p: r() * 6, s: rndRange(r, 2, 3) })),
    ripples: Array.from({ length: 30 }, () => ({ x: r() * VW, y: rndRange(r, 112, 174), len: rndRange(r, 6, 22), a: rndRange(r, 0.06, 0.18) })),
    sand: particles(r, 30, { vx: [3, 9], vy: [-1, 1], size: [1, 1] }),
  };
}
function drawDesert(s, P, t, dt) {
  bandGradient(0, 92, [
    mix(P.sky[0], P.accent, 0.2),
    mix(P.sky[1], [255, 214, 160], 0.35),
    mix(P.sky[2], [255, 226, 176], 0.5),
  ]);
  const sx = 244, sy = 34, sr = 11;
  glow(sx, sy, 40, rgba(mix(P.sun, [255, 220, 150], 0.5), 0.2), 1);
  for (let y = -sr; y <= sr; y++) {
    const dx = Math.sqrt(Math.max(0, sr * sr - y * y)) | 0;
    rect(sx - dx, sy + y, dx * 2, 1, rgb(mix(P.sun, [255, 246, 220], 0.55)));
  }
  for (const v of s.vultures) {                    // грифы кружат
    v.x -= 5 * dt;
    if (v.x < -12) v.x = VW + 10;
    const flap = Math.sin(t * 3 + v.p) > 0;
    const c = rgb(mix(P.ink, P.sky[1], 0.2));
    rect(v.x, v.y + Math.sin(t * 0.8 + v.p) * 3, v.s * 3, 1, c);
    rect(v.x - v.s, v.y - (flap ? 2 : 0) + Math.sin(t * 0.8 + v.p) * 3, v.s, 1, c);
    rect(v.x + v.s * 3, v.y - (flap ? 2 : 0) + Math.sin(t * 0.8 + v.p) * 3, v.s, 1, c);
  }
  const mon = s.monolith;                          // обелиск
  rect(mon.x, 92 - mon.h, 8, mon.h, rgb(mix(P.deep, P.ink, 0.3)));
  rect(mon.x + 1, 92 - mon.h, 2, mon.h, rgba(mix(P.sun, P.accent, 0.4), 0.25));
  for (const d of s.dunes) {
    const off = t * d.speed;
    paint(rgb(d.color));
    g.beginPath();
    g.moveTo(0, VH);
    for (let x = 0; x <= VW; x += 2) {
      const wx = ((x + off) % 260 + 260) % 260;
      g.lineTo(x, d.base - (ridge(d.seed + wx * d.freq, 1, 4) * 0.5 + 0.5) * d.amp);
    }
    g.lineTo(VW, VH); g.closePath(); g.fill();
  }
  for (const rp of s.ripples) {                    // рябь на песке
    rp.x -= 4 * dt;
    if (rp.x < -24) rp.x = VW + 10;
    rect(rp.x, rp.y, rp.len, 1, rgba(mix(P.sun, [255, 240, 200], 0.4), rp.a));
  }
  // караван идёт справа налево
  const cv = s.caravan;
  cv.x -= cv.speed * dt;
  if (cv.x < -60) cv.x = VW + 40;
  const phase = Math.floor(t * 4) % 2;
  for (let i = 0; i < 3; i++) {
    const cx = cv.x + i * 20, cy = 130 + Math.sin(t * 1.4 + i) * 1.2 + i;
    const art = phase ? SPRITES.camelB : SPRITES.camelA;
    sprite(art, cx, cy, { a: rgb(mix(P.deep, P.ink, 0.25)) }, true);
    rect(cx - 1, cy + 7, 11, 1, rgba(P.deep, 0.3));
  }
  rect(0, 168, VW, VH - 168, rgb(mix(P.deep, P.ink, 0.2)));   // ближний гребень
  for (let x = 0; x < VW; x += 7) rect(x, 168 - ((x * 13) % 3), 4, 1, rgb(mix(P.deep, P.ink, 0.2)));
  drift(s.sand, { vx: [3, 9], vy: [-1, 1], fade: () => 0.35 }, dt, rgba(mix(P.sun, [255, 230, 180], 0.4), 0.3));
}

// --- руины: колонны, арка, лучи света, папоротники
function buildRuins(r, P) {
  return {
    columns: Array.from({ length: 8 }, (_, i) => ({
      x: 6 + i * 44 + rndRange(r, -9, 9), h: rndRange(r, 44, 104), w: rndInt(r, 9, 15),
      cap: r() < 0.6, seed: r() * 9,
    })),
    vines: Array.from({ length: 18 }, () => ({ x: r() * VW, len: rndRange(r, 12, 46), y: rndRange(r, 0, 40), p: r() * 6 })),
    moss: Array.from({ length: 34 }, () => ({ x: r() * VW, y: rndRange(r, 118, 176), s: rndRange(r, 2, 7) })),
    ferns: Array.from({ length: 9 }, (_, i) => ({ x: i * 38 + rndRange(r, -12, 12), h: rndRange(r, 10, 22) })),
    flies: particles(r, 20, { vx: [-3, 3], vy: [-2, 2] }),
    ray: r() * 30,
  };
}
function drawRuins(s, P, t, dt) {
  bandGradient(0, 150, [
    mix(P.sky[1], P.fog, 0.45),
    mix(P.sky[2], P.fog, 0.35),
    mix(P.sky[2], P.fog, 0.2),
  ]);
  // лучи света сквозь прорехи в крыше
  for (let i = 0; i < 3; i++) {
    const x = 40 + i * 96 + Math.sin(t * 0.2 + i) * 6;
    paint(rgba(mix(P.sun, P.glow, 0.4), 0.07));
    g.beginPath();
    g.moveTo(x, 0); g.lineTo(x + 26, 0); g.lineTo(x + 64, 150); g.lineTo(x + 10, 150);
    g.closePath(); g.fill();
  }
  // арка на дальней стене
  const ax = 120, aw = 76, ab = 150;
  rect(ax - 6, 62, 8, ab - 62, rgb(mix(P.deep, P.sky[1], 0.3)));
  rect(ax + aw - 2, 62, 8, ab - 62, rgb(mix(P.deep, P.sky[1], 0.3)));
  for (let i = 0; i <= 30; i++) {
    const a = Math.PI * (i / 30);
    rect(ax + aw / 2 - Math.cos(a) * (aw / 2 + 6), 62 - Math.sin(a) * 22, 5, 5, rgb(mix(P.deep, P.sky[1], 0.3)));
  }
  rect(ax, 84, aw, ab - 84, rgba(mix(P.deep, P.ink, 0.45), 0.85));
  for (const v of s.vines) {                       // лианы
    const sway = Math.sin(t * 0.7 + v.p) * 2;
    for (let y = 0; y < v.len; y++) rect(v.x + sway * (y / v.len), v.y + y, 1, 1, rgb(mix(P.deep, P.accent, 0.3)));
    rect(v.x + sway, v.y + v.len, 2, 2, rgb(mix(P.deep, P.accent, 0.4)));
  }
  // колонны: сначала дальние, потом ближние
  for (let pass = 0; pass < 2; pass++) {
    for (const c of s.columns) {
      const near = c.x % 2 === pass;
      const col = rgb(mix(P.deep, pass ? P.sky[1] : P.ink, pass ? 0.28 : 0.12));
      rect(c.x, 150 - c.h, c.w, c.h, col);
      rect(c.x, 150 - c.h, c.w, 2, rgb(mix(col, [255, 250, 230], 0.12)));
      for (let y = 150 - c.h + 4; y < 150; y += 5) rect(c.x, y, c.w, 1, rgba(P.deep, pass ? 0.25 : 0.45));
      if (c.cap) rect(c.x - 2, 150 - c.h - 4, c.w + 4, 4, col);
      if (c.x % 3 < 1) rect(c.x + 1, 150 - c.h, c.w - 3, 3, rgba(P.deep, 0.5));   // скол
    }
  }
  rect(0, 150, VW, VH - 150, rgb(mix(P.deep, P.accent, 0.14)));   // пол
  for (const m of s.moss) {
    ditherFill(m.x, m.y, m.s * 2, 2, rgba(mix(P.accent, P.deep, 0.35), 0.5), m.s & 1);
  }
  for (const f of s.ferns) {                       // папоротники на переднем плане
    const sway = Math.sin(t * 0.9 + f.x) * 2;
    for (let a = 0; a < 5; a++) {
      const ang = -1.9 - a * 0.3;
      for (let l = 2; l < f.h; l++) {
        rect(f.x + Math.cos(ang) * l + sway, VH - 2 + Math.sin(ang) * l, 2, 1, rgb(mix(P.deep, P.accent, 0.25)));
      }
    }
  }
  if (P.time === 'ночь' || P.time === 'гроза') {
    drift(s.flies, { vx: [-4, 4], vy: [-3, 3], wobbleFreq: 2, wobble: 5, fade: (p) => 0.3 + 0.7 * Math.abs(Math.sin(NOW * 1.5 + p.p)) }, dt,
      () => rgba(mix(P.pale, [255, 240, 170], 0.5), 0.8));
  }
}

// --- маяк: луч по кругу, море, скалы
function buildLighthouse(r, P) {
  return {
    stars: Array.from({ length: 60 }, () => ({ x: r() * VW, y: r() * 100, p: r() * 6, s: r() < 0.85 ? 1 : 2 })),
    clouds: Array.from({ length: 3 }, () => ({ x: r() * VW, y: rndRange(r, 30, 62), w: rndRange(r, 40, 80), s: rndRange(r, 2, 5) })),
    waves: Array.from({ length: 26 }, (_, i) => ({ y: 108 + i * 3, len: rndRange(r, 8, 26), x: r() * VW, v: rndRange(r, 3, 11), a: rndRange(r, 0.1, 0.3) })),
    ship: { x: rndRange(r, 40, 120) },
    gulls: Array.from({ length: 3 }, () => ({ x: r() * VW, y: rndRange(r, 70, 96), p: r() * 6, v: rndRange(r, 5, 11) })),
    foam: particles(r, 22, { vx: [-4, 4], vy: [-4, 0], spanY: [140, 172], size: [1, 2] }),
  };
}
function drawLighthouse(s, P, t, dt) {
  bandGradient(0, 104, [
    mix(P.deep, P.sky[0], 0.4),
    mix(P.deep, P.sky[1], 0.3),
    mix(P.ink, P.sky[2], 0.25),
  ]);
  for (const st of s.stars) {
    const tw = 0.5 + 0.5 * Math.sin(t * 1.5 + st.p);
    rect(st.x, st.y, st.s, st.s, rgba(P.sun, 0.75 * tw));
  }
  for (const c of s.clouds) {                      // низкие тучи
    const x = ((c.x + t * c.s) % (VW + 110) + VW + 110) % (VW + 110) - 55;
    ditherFill(x, c.y, c.w, 5, rgba(mix(P.deep, P.sky[1], 0.35), 0.5), 0);
    ditherFill(x + 8, c.y - 4, c.w - 18, 4, rgba(mix(P.deep, P.sky[1], 0.28), 0.4), 1);
  }
  rect(0, 104, VW, VH - 104, rgb(mix(P.deep, P.sky[1], 0.3)));    // море
  rect(0, 104, VW, 1, rgba(mix(P.sun, P.accent, 0.35), 0.3));
  for (const w of s.waves) {
    w.x += w.v * dt;
    if (w.x > VW) w.x = -w.len;
    rect(w.x, w.y, w.len, 1, rgba(mix(P.sun, P.accent, 0.3), w.a * 0.7));
  }
  const sh = s.ship;                               // корабль на горизонте
  sh.x += 1.6 * dt;
  if (sh.x > VW + 20) sh.x = -20;
  rect(sh.x, 100, 16, 3, rgb(mix(P.deep, P.ink, 0.3)));
  rect(sh.x + 6, 96, 4, 4, rgb(mix(P.deep, P.ink, 0.3)));
  rect(sh.x + 7, 93, 2, 4, rgba(mix(P.sun, P.accent, 0.4), 0.6));
  rect(sh.x + 2, 100, 1, 1, rgba([255, 190, 140], 0.85));
  for (const g of s.gulls) {
    g.x -= g.v * dt;
    if (g.x < -10) g.x = VW + 8;
    const flap = Math.sin(t * 6 + g.p) > 0;
    sprite(flap ? SPRITES.birdA : SPRITES.birdB, g.x, g.y, { a: rgba(P.ink, 0.7) }, false);
  }
  // скала и маяк
  const cliff = rgb(mix(P.deep, P.ink, 0.2));
  silhouette(61, 128, 22, 0.02, rgb(mix(P.deep, P.sky[1], 0.12)), 2);
  paint(cliff);
  g.beginPath();
  g.moveTo(196, VH); g.lineTo(210, 108); g.lineTo(238, 96); g.lineTo(300, 104); g.lineTo(320, VH);
  g.closePath(); g.fill();
  const lx = 262, baseY = 100, topY = 38;
  for (let y = topY; y < baseY; y++) {             // сужающаяся башня
    const k = (y - topY) / (baseY - topY);
    const w = 5 + k * 5;
    rect(lx - w / 2, y, w, 1, k > 0.32 && k < 0.42 ? rgb(mix(P.pale, P.accent, 0.3)) : rgb(mix(P.sky[1], P.ink, 0.45)));
  }
  rect(lx - 8, 44, 16, 3, rgb(mix(P.deep, P.sky[2], 0.4)));       // галерея
  rect(lx - 6, topY - 6, 12, 10, rgb(mix(P.deep, P.ink, 0.25)));  // лампа
  rect(lx - 4, topY - 4, 8, 6, rgb(mix(P.sun, [255, 240, 190], 0.55)));
  paint(rgb(mix(P.deep, P.ink, 0.25)));
  g.beginPath(); g.moveTo(lx - 8, topY - 6); g.lineTo(lx, topY - 14); g.lineTo(lx + 8, topY - 6);
  g.closePath(); g.fill();
  // луч: медленно ходит по морю
  const ang = Math.sin(t * 0.32) * 1.15;
  const bx = lx, by = topY - 1;
  const ex = bx + Math.cos(Math.PI + ang) * 300, ey = by + Math.sin(ang) * 70;
  g.globalAlpha = 0.16 + 0.07 * Math.sin(t * 1.9);
  paint(rgb(mix(P.sun, [255, 244, 200], 0.45)));
  g.beginPath(); g.moveTo(bx, by); g.lineTo(ex, ey - 13); g.lineTo(ex, ey + 13); g.closePath(); g.fill();
  g.globalAlpha = 1;
  glow(bx, by, 12, rgba(mix(P.sun, [255, 240, 190], 0.6), 0.5), 1);
  drift(s.foam, { vx: [-4, 4], vy: [-4, 0], fade: (p) => 0.4 }, dt, rgba(mix(P.pale, P.sky[2], 0.4), 0.4));
  // передний план: камни
  paint(rgb(mix(P.deep, P.ink, 0.05)));
  g.beginPath();
  g.moveTo(0, VH); g.lineTo(14, 160); g.lineTo(40, 168); g.lineTo(58, VH); g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(90, VH); g.lineTo(104, 170); g.lineTo(126, VH); g.closePath(); g.fill();
}

// --- метро: платформа, поезд из тоннеля, ожидание
function buildSubway(r, P) {
  return {
    train: { x: 340, state: 'idle', next: 6 + r() * 5, v: 0 },
    traveler: { x: rndRange(r, 60, 120), p: r() * 6, phone: 0 },
    litter: Array.from({ length: 8 }, () => ({ x: r() * VW, y: rndRange(r, 152, 176), p: r() * 6 })),
    flicker: r() * 4,
    tubes: [46, 160, 276],
  };
}
function drawSubway(s, P, t, dt) {
  rect(0, 0, VW, 150, rgb(mix(P.deep, P.sky[1], 0.22)));          // стена
  for (let y = 6; y < 118; y += 8) {                              // плитка
    rect(0, y, VW, 1, rgba(P.deep, 0.28));
    for (let x = ((y / 8) % 2) * 8; x < VW; x += 16) rect(x, y, 1, 8, rgba(P.deep, 0.22));
  }
  rect(0, 116, VW, 3, rgb(mix(P.pale, P.sky[2], 0.4)));           // бордюр
  rect(0, 119, VW, 31, rgb(mix(P.deep, P.ink, 0.5)));             // путь
  for (let x = 0; x < VW; x += 12) rect(x, 132, 8, 2, rgb(mix(P.deep, P.accent, 0.14)));
  rect(0, 126, VW, 1, rgb(mix(P.sky[2], P.ink, 0.35)));
  rect(0, 138, VW, 1, rgb(mix(P.sky[2], P.ink, 0.35)));
  rect(0, 150, VW, VH - 150, rgb(mix(P.deep, P.accent, 0.16)));   // платформа
  rect(0, 150, VW, 1, rgba(mix(P.sun, P.accent, 0.4), 0.4));
  rect(0, 147, VW, 3, rgb(mix(P.sun, P.accent, 0.4)));            // жёлтая линия
  // тоннель
  rect(268, 96, 52, 54, rgb(mix(P.deep, P.ink, 0.6)));
  for (let i = 0; i < 16; i++) {
    const a = Math.PI * (i / 15);
    rect(268 + 26 - Math.cos(a) * 26, 96 - Math.sin(a) * 18, 6, 6, rgb(mix(P.deep, P.ink, 0.6)));
  }
  // постер и часы
  rect(126, 44, 44, 30, rgba(P.deep, 0.5));
  rect(127, 45, 42, 28, rgb(mix(P.pale, P.sky[2], 0.45)));
  rect(127, 45, 42, 9, rgba(mix(P.accent, P.sun, 0.3), 0.9));
  rect(131, 58, 34, 2, rgba(P.deep, 0.35));
  rect(131, 63, 26, 2, rgba(P.deep, 0.25));
  rect(131, 68, 30, 2, rgba(P.deep, 0.2));
  const cx = 216, cy = 54;
  rect(cx - 9, cy - 9, 18, 18, rgb(mix(P.deep, P.ink, 0.3)));
  rect(cx - 8, cy - 8, 16, 16, rgb(mix(P.pale, P.sky[2], 0.35)));
  rect(cx, cy - 6, 1, 7, rgba(P.deep, 0.8));
  rect(cx, cy, 4, 1, rgba(P.deep, 0.8));
  // лампы дневного света
  for (let i = 0; i < s.tubes.length; i++) {
    const x = s.tubes[i];
    const flick = 0.75 + 0.25 * Math.sin(t * 21 + i * 2) * (Math.random() < 0.04 ? 0.2 : 1);
    rect(x, 10, 44, 3, rgba(mix(P.pale, [255, 255, 240], 0.5), 0.85 * flick));
    glow(x + 22, 30, 34, rgba(mix(P.pale, P.sun, 0.3), 0.06 * flick), 1);
    ditherFill(x - 20, 150, 84, 14, rgba(mix(P.pale, P.sun, 0.3), 0.06 * flick), 0);   // пятно на полу
  }
  // скамейка и пассажир
  rect(24, 132, 52, 4, rgb(mix(P.deep, P.accent, 0.25)));
  rect(28, 136, 3, 14, rgb(mix(P.deep, P.ink, 0.35)));
  rect(69, 136, 3, 14, rgb(mix(P.deep, P.ink, 0.35)));
  const tv = s.traveler;
  rect(tv.x - 4, 128, 9, 16, rgb(mix(P.pale, P.accent, 0.35)));
  rect(tv.x - 3, 121, 7, 7, rgb(mix(P.pale, [255, 226, 200], 0.5)));
  rect(tv.x - 4, 144, 3, 7, rgb(mix(P.deep, P.accent, 0.3)));
  rect(tv.x + 2, 144, 3, 7, rgb(mix(P.deep, P.accent, 0.3)));
  rect(tv.x - 7, 130, 3, 9, rgb(mix(P.deep, P.accent, 0.3)));      // сумка
  if ((t * 0.3) % 1 > 0.7) rect(tv.x + 4, 126, 4, 3, rgba([190, 230, 255], 0.7));
  // поезд
  const tr = s.train;
  tr.next -= dt;
  if (tr.state === 'idle' && tr.next < 2.6) {                     // свет из тоннеля
    const g2 = 1 - tr.next / 2.6;
    glow(292, 124, 16 * g2 + 6, rgba([255, 240, 200], 0.5 * g2), 1);
  }
  if (tr.state === 'idle' && tr.next <= 0) { tr.state = 'go'; tr.x = 340; tr.next = 11 + Math.random() * 7; }
  if (tr.state === 'go') {
    tr.x -= 470 * dt;
    shake(0.18);
    const bx = tr.x;
    rect(bx, 96, 480, 62, rgb(mix(P.deep, P.ink, 0.35)));          // корпус
    rect(bx, 96, 480, 4, rgb(mix(P.sky[2], P.ink, 0.3)));
    for (let i = 0; i < 22; i++) {                                 // окна и двери
      const wx = bx + 8 + i * 22;
      if (wx < -24 || wx > VW + 8) continue;
      rect(wx, 104, 14, 22, rgb(mix(P.pale, P.sky[2], 0.4)));
      rect(wx + 2, 108, 10, 6, rgba(mix(P.sun, [255, 240, 200], 0.4), 0.75));
    }
    rect(bx, 132, 480, 4, rgb(mix(P.deep, P.accent, 0.3)));
    if (bx > -20 && bx < VW) {                                     // ветер от поезда
      for (const l of s.litter) l.x += 40 * dt * (1 + (l.y - 152) / 24);
    }
    if (tr.x < -480) tr.state = 'idle';
  }
  for (const l of s.litter) {                                      // мусор на платформе
    l.x -= 2 * dt;
    if (l.x < -4) l.x = VW + 4;
    rect(l.x, l.y + Math.sin(t * 2 + l.p) * 1, 2, 1, rgba(mix(P.sky[2], P.ink, 0.3), 0.5));
  }
}

// --- обсерватория: купол, телескоп, журнал наблюдений
function buildObservatory(r, P) {
  return {
    stars: Array.from({ length: 90 }, () => ({ x: r() * VW, y: r() * 92, p: r() * 6, s: r() < 0.85 ? 1 : 2 })),
    milky: Array.from({ length: 90 }, () => ({ x: r() * VW, y: r() * 92, s: rndRange(r, 1, 2) })),
    scope: { ang: -0.62, drift: rndRange(r, -0.05, 0.05), glint: 0 },
    shoot: { x: 0, y: 0, life: 0, next: 6 + r() * 8 },
    lamp: { flick: 0 },
    desk: { x: 176, y: 138 },
  };
}
function drawObservatory(s, P, t, dt) {
  const wall = rgb(mix(P.deep, P.ink, 0.38));
  rect(0, 0, VW, VH, wall);                        // стена зала
  // небо в прорези купола
  bandGradient(0, 92, [mix(P.deep, P.sky[0], 0.5), mix(P.deep, P.sky[1], 0.32), mix(P.ink, P.sky[2], 0.25)]);
  for (const st of s.stars) {
    const tw = 0.45 + 0.55 * Math.sin(t * 1.6 + st.p);
    rect(st.x, st.y, st.s, st.s, rgba(P.sun, 0.8 * tw));
  }
  g.globalAlpha = 0.16;                            // млечный путь
  for (const m of s.milky) rect(m.x + m.y * 0.5, m.y, m.s, m.s, rgb(mix(P.pale, P.sky[1], 0.3)));
  g.globalAlpha = 1;
  // падающая звезда
  const sh = s.shoot;
  sh.next -= dt;
  if (sh.next <= 0) { sh.next = 9 + Math.random() * 10; sh.life = 0.7; sh.x = 40 + Math.random() * 200; sh.y = 10 + Math.random() * 40; }
  if (sh.life > 0) {
    sh.life -= dt;
    const k = sh.life / 0.7;
    for (let i = 0; i < 9; i++) rect(sh.x + i * 3, sh.y + i * 1.2, 2, 1, rgba(mix(P.pale, P.sun, 0.4), 0.8 * k * (1 - i / 9)));
  }
  // купол
  const dome = rgb(mix(P.deep, P.ink, 0.3));
  paint(dome);
  g.beginPath();
  g.moveTo(0, 0); g.lineTo(118, 0);
  g.quadraticCurveTo(126, 60, 150, 96); g.lineTo(0, 96);
  g.closePath(); g.fill();
  g.beginPath();
  g.moveTo(VW, 0); g.lineTo(212, 0);
  g.quadraticCurveTo(206, 60, 190, 96); g.lineTo(VW, 96);
  g.closePath(); g.fill();
  rect(0, 92, VW, 60, wall);                       // стена под прорезью
  for (let x = 0; x < 118; x += 6) rect(x, 90 + ((x * 7) % 3), 4, 2, rgba(P.ink, 0.35));   // заклёпки
  // телескоп
  const mx = 150, my = 152;
  const ang = 0.34 + Math.sin(t * 0.14) * 0.05 + s.scope.drift;
  g.save();
  g.translate(mx, my);
  g.rotate(ang);
  paint(rgb(mix(P.sky[2], P.ink, 0.45)));
  g.fillRect(-7, -96, 14, 96);
  paint(rgb(mix(P.pale, P.sky[2], 0.35)));
  g.fillRect(-6, -96, 4, 96);
  paint(rgb(mix(P.deep, P.ink, 0.3)));
  g.fillRect(-9, -100, 18, 8);
  g.fillRect(-9, -16, 18, 6);
  g.fillRect(-3, -112, 6, 12);
  paint(rgba(mix(P.sun, P.pale, 0.5), 0.9));
  g.fillRect(-5, -112, 10, 3);
  g.restore(); resetPaint();
  paint(rgb(mix(P.deep, P.ink, 0.35)));     // монтировка
  g.beginPath(); g.moveTo(mx - 16, my + 14); g.lineTo(mx, my - 4); g.lineTo(mx + 16, my + 14); g.closePath(); g.fill();
  rect(mx - 22, my + 12, 44, 4, rgb(mix(P.deep, P.ink, 0.35)));
  rect(mx - 4, my + 2, 8, 8, rgb(mix(P.sky[2], P.ink, 0.4)));
  // пол и рельс
  rect(0, 152, VW, VH - 152, rgb(mix(P.deep, P.accent, 0.14)));
  for (let y = 152; y < VH; y += 4) ditherFill(0, y, VW, 4, rgba(mix(P.deep, P.ink, 0.4), 0.25), y & 4 ? 0 : 1);
  paint(rgba(mix(P.sky[2], P.ink, 0.35), 0.6));
  for (let x = 20; x < VW; x += 2) rect(x, 164 + Math.sin((x / VW) * 3.14) * 4, 2, 1, rgba(mix(P.sky[2], P.ink, 0.4), 0.5));
  // стол с лампой и журналом
  const d = s.desk;
  const flick = 0.85 + 0.15 * Math.sin(t * 13.7);
  rect(d.x, d.y + 8, 84, 5, rgb(mix(P.deep, P.sun, 0.25)));
  rect(d.x + 4, d.y + 13, 4, 16, rgb(mix(P.deep, P.ink, 0.35)));
  rect(d.x + 74, d.y + 13, 4, 16, rgb(mix(P.deep, P.ink, 0.35)));
  rect(d.x + 30, d.y + 2, 22, 6, rgb(mix(P.pale, P.sky[2], 0.4)));
  rect(d.x + 33, d.y + 4, 16, 1, rgba(P.deep, 0.35));
  rect(d.x + 12, d.y - 2, 8, 10, rgb(mix(P.deep, P.ink, 0.3)));
  rect(d.x + 14, d.y - 6, 4, 5, rgba(mix(P.sun, [255, 236, 180], 0.5), 0.9 * flick));
  glow(d.x + 16, d.y, 16, rgba(mix(P.sun, P.accent, 0.35), 0.16 * flick), 1);
  rect(d.x + 22, d.y + 4, 3, 4, rgb(mix(P.pale, P.accent, 0.3)));   // кружка
}

// ---------------------------------------------------------------- подпись
// ONE1GAME вшит в каждую игру как часть кадра: где-то вывеска на столбе,

// в углу — как игровой приём, а не реклама.
const BRAND = 'ONE1GAME';
const BRAND_SUB = 'SUBSCRIBE';
// Вид вывески и её место в кадре — у каждого жанра своё, поэтому подпись
// читается частью мира, а не наклейкой сверху.
const BRAND_KIND = {

  cyber: ['neon', 'screen'], abstract: ['neon', 'screen'], vapor: ['neon', 'billboard'],
  dungeon: ['stone', 'poster'], ruins: ['stone', 'plaque'], underwater: ['stone', 'screen'],
  space: ['screen', 'neon'], shooter: ['screen', 'neon'], observatory: ['plaque', 'poster'],
  duel: ['banner', 'billboard'], dragon: ['banner', 'stone'],

const BRAND_POS = {
  platformer: [226, 122], rpg: [12, 126], space: [14, 14], cyber: [224, 18],
  dungeon: [14, 118], underwater: [234, 124], vapor: [224, 78], snow: [232, 124],
  abstract: [16, 82], shooter: [12, 140], duel: [16, 42], dragon: [12, 96],

  lighthouse: [212, 126], subway: [186, 86], observatory: [18, 120],
};
function brand(x, y, P, kind, sub, t) {
  const w = textWidth(BRAND, 1) + 6;
  const h = sub ? 16 : 9;
  const wood = rgb(mix(P.deep, [122, 88, 56], 0.5));
  const slab = rgb(mix(P.sky[1], P.ink, 0.3));
  const shade = rgb(mix(P.deep, P.ink, 0.45));
  const lit = rgba(mix(P.sun, P.pale, 0.55), 0.95);
  const hot = rgba(mix(P.accent, P.sun, 0.35), 0.95);
  const tone = kind === 'neon' || kind === 'screen' ? hot : lit;
  if (kind === 'plank') {                          // доска на двух столбах
    rect(x + 4, y + h, 2, 16, wood);
    rect(x + w - 7, y + h, 2, 16, wood);
    rect(x - 1, y - 1, w + 2, h + 2, shade);
    rect(x, y, w, h, wood);
    rect(x, y, w, 1, rgba(mix(wood, [255, 240, 210], 0.3), 0.6));
  } else if (kind === 'stone') {                   // каменная табличка
    rect(x - 1, y - 1, w + 2, h + 2, rgb(mix(P.deep, P.ink, 0.3)));
    rect(x, y, w, h, slab);
    rect(x + 1, y + 1, w - 2, h - 2, rgb(mix(slab, P.deep, 0.3)));
  } else if (kind === 'neon') {                    // неоновая вывеска
    glow(x - 3, y + h / 2 - 4, 12, rgba(mix(P.accent, P.sun, 0.3), 0.16), 1);
    rect(x - 1, y - 1, w + 2, h + 2, rgba(mix(P.deep, P.accent, 0.35), 0.85));
    const blink = 0.82 + 0.18 * Math.sin(t * 17.3);
    g.globalAlpha = blink;
  } else if (kind === 'screen') {                  // монитор с развёрткой
    rect(x - 3, y - 3, w + 6, h + 6, rgb(mix(P.deep, P.ink, 0.4)));
    rect(x - 2, y - 2, w + 4, h + 4, rgba(mix(mix(P.accent, P.sun, 0.3), P.ink, 0.55), 0.9));
    for (let yy = y; yy < y + h; yy += 2) rect(x - 1, yy, w + 2, 1, rgba(P.deep, 0.18));
  } else if (kind === 'banner') {                  // полотнище на шнуре
    rect(x - 2, y - 3, w + 4, 1, rgb(shade));
    rect(x, y, w, h + 2, rgb(mix(P.accent, P.deep, 0.45)));
    for (let i = 1; i <= 2; i++) rect(x + i * 3, y + h + 2, 3, 1, rgb(mix(P.accent, P.deep, 0.45)));
  } else if (kind === 'poster') {                  // бумага на стене
    rect(x - 1, y - 1, w + 2, h + 2, rgba(P.deep, 0.6));
    rect(x, y, w, h, rgb(mix(P.pale, P.sky[2], 0.4)));
    rect(x, y, w, 3, rgba(mix(P.accent, P.sun, 0.3), 0.9));
  } else if (kind === 'plaque') {                  // металлическая пластина
    rect(x - 1, y - 1, w + 2, h + 2, rgb(mix(P.deep, P.ink, 0.4)));
    rect(x, y, w, h, rgb(mix(P.sky[2], P.ink, 0.22)));
    rect(x + 1, y + 1, 1, 1, rgba(mix(P.sun, P.accent, 0.4), 0.9));
    rect(x + w - 2, y + 1, 1, 1, rgba(mix(P.sun, P.accent, 0.4), 0.9));
  } else {                                         // рекламный щит
    rect(x + 5, y + h, 2, 20, wood);
    rect(x + w - 8, y + h, 2, 20, wood);
    rect(x - 2, y - 2, w + 4, h + 4, shade);
    rect(x, y, w, h, rgb(mix(P.deep, P.accent, 0.3)));
  }
  text(BRAND, x + 3, y + (sub ? 2 : 1), tone, 1);
  if (sub) {
    g.globalAlpha = (g.globalAlpha || 1) * 0.75;
    text(BRAND_SUB, x + 3, y + 9, rgba(mix(P.sun, P.accent, 0.4), 0.9), 1);
  }
  g.globalAlpha = 1;
}
