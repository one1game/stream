// ---------------------------------------------------------------- погода
// Один слой на все сцены: что сыплется с неба, решает жанр и время суток.
// Один и тот же лес под дождём и в снегу читается разными играми.
const WEATHER = {
  platformer: ['leaves', 'none', 'rain'],
  rpg: ['leaves', 'petals', 'rain'],
  space: ['none', 'dust'],
  cyber: ['rain', 'rain', 'none'],
  dungeon: ['ash', 'dust'],
  underwater: ['bubbles', 'bubbles', 'none'],
  vapor: ['dust', 'petals', 'none'],
  snow: ['snow', 'snow', 'none'],
  abstract: ['none', 'dust'],
  shooter: ['none', 'dust'],
  duel: ['dust', 'none'],
  dragon: ['ash', 'snow', 'none'],
  island: ['petals', 'none', 'rain'],
  train: ['rain', 'leaves', 'none'],
  desert: ['dust', 'none'],
  ruins: ['fireflies', 'leaves', 'none'],
  lighthouse: ['rain', 'none'],
  subway: ['none', 'dust'],
  observatory: ['none', 'snow'],
};
const WEATHER_N = { rain: 70, snow: 60, ash: 44, petals: 34, leaves: 26, dust: 46, bubbles: 34, fireflies: 22 };
function makeWeather(r, genre, time) {
  const kind = pick(r, WEATHER[genre] || ['none']);
  if (kind === 'none') return { kind: 'none', list: [] };
  const n = WEATHER_N[kind] || 40;
  const list = Array.from({ length: n }, () => ({
    x: r() * VW, y: r() * VH, v: rndRange(r, 0.6, 1.4), p: r() * 6.28, s: r() < 0.75 ? 1 : 2,
  }));
  return { kind, list };
}
function drawWeather(P, t, dt) {
  const w = director.weather;
  if (!w || w.kind === 'none') return;
  const kind = w.kind;
  for (const p of w.list) {
    if (kind === 'rain') {
      p.y += (150 + p.v * 110) * dt;
      p.x -= 30 * p.v * dt;
      if (p.y > VH) { p.y = -10; p.x = Math.random() * VW + 24; }
      if (p.x < -6) p.x = VW + 4;
      rect(p.x, p.y, 1, p.v > 1.1 ? 6 : 3, rgba(mix(P.sky[2], P.sun, 0.35), 0.3));
    } else if (kind === 'snow') {
      p.y += 16 * p.v * dt;
      p.x += (Math.sin(t * 0.7 + p.p) * 9 - 4) * dt;
      if (p.y > VH) { p.y = -3; p.x = Math.random() * VW; }
      if (p.x < -3) p.x = VW + 2; else if (p.x > VW + 3) p.x = -2;
      rect(p.x, p.y, p.s, p.s, rgba(mix(P.pale, [255, 255, 255], 0.4), 0.65));
    } else if (kind === 'ash') {
      p.y += 9 * p.v * dt;
      p.x += Math.sin(t * 1.3 + p.p) * 12 * dt;
      if (p.y > VH) p.y = -3;
      rect(p.x, p.y, p.s, p.s, rgba(mix(P.sky[2], P.sun, 0.25), 0.35));
    } else if (kind === 'petals') {
      p.y += 13 * p.v * dt;
      p.x += Math.sin(t * 1.1 + p.p) * 16 * dt;
      if (p.y > VH) { p.y = -3; p.x = Math.random() * VW; }
      rect(p.x, p.y, 2, 1, rgba(mix(P.accent, P.sun, 0.45), 0.55));
    } else if (kind === 'leaves') {
      p.y += 15 * p.v * dt;
      p.x += Math.sin(t * 1.6 + p.p) * 13 * dt;
      if (p.y > VH) { p.y = -3; p.x = Math.random() * VW; }
      rect(p.x, p.y + ((t * 3 + p.p) % 1 > 0.5 ? 0 : 1), 2, 1, rgba(mix(P.accent, [190, 130, 70], 0.5), 0.6));
    } else if (kind === 'dust') {
      p.x += (p.v * 7 + Math.sin(t * 0.9 + p.p) * 6) * dt;
      p.y += Math.sin(t * 0.6 + p.p) * 5 * dt;
      if (p.x > VW + 3) p.x = -3;
      rect(p.x, p.y, 1, 1, rgba(mix(P.sun, P.accent, 0.3), 0.3));
    } else if (kind === 'bubbles') {
      p.y -= (10 + p.v * 12) * dt;
      p.x += Math.sin(t * 1.7 + p.p) * 6 * dt;
      if (p.y < -3) { p.y = VH + 3; p.x = Math.random() * VW; }
      rect(p.x, p.y, p.s, p.s, rgba(mix(P.pale, P.sky[2], 0.4), 0.3));
    } else if (kind === 'fireflies') {
      p.x += Math.sin(t * 0.5 + p.p) * 8 * dt;
      p.y += Math.cos(t * 0.4 + p.p * 1.7) * 7 * dt;
      if (p.x < -3) p.x = VW + 2; else if (p.x > VW + 3) p.x = -2;
      if (p.y < 40) p.y = VH - 10; else if (p.y > VH) p.y = 42;
      const blink = Math.abs(Math.sin(t * 1.4 + p.p));
      if (blink > 0.35) rect(p.x, p.y, 1, 1, rgba(mix(P.pale, [255, 240, 170], 0.5), 0.75 * blink));
    }
  }
}
// ---------------------------------------------------------------- режиссёр
// Настроение радио -> жанр. Если музыки нет, жанр берётся по кругу.
const MOOD_GENRE = {
  dusty: ['platformer', 'desert', 'snow'],
  jazzhop: ['rpg', 'train', 'platformer'],
  chillhop: ['train', 'platformer', 'island'],
  midnight: ['cyber', 'subway', 'space'],
  ambient: ['observatory', 'space', 'lighthouse'],
  experimental: ['abstract', 'observatory', 'cyber'],
  'lofi-house': ['cyber', 'vapor', 'subway'],
  soul: ['ruins', 'rpg', 'duel'],
  bossa: ['island', 'lighthouse', 'vapor'],
  piano: ['observatory', 'snow', 'train'],
  dark: ['dungeon', 'ruins', 'dragon'],
  trap: ['shooter', 'subway', 'cyber'],
  dub: ['underwater', 'subway', 'dungeon'],
  vapor: ['vapor', 'desert', 'shooter'],
  chip: ['shooter', 'subway', 'platformer'],
  guitar: ['desert', 'vapor', 'platformer'],
  strings: ['ruins', 'dragon', 'snow'],
  vocal: ['duel', 'subway', 'abstract'],
  musicbox: ['observatory', 'rpg', 'snow'],
  bedroom: ['train', 'rpg', 'island'],
};

const director = {
  genre: null,
  scene: null,
  palette: null,
  game: null,       // картридж: название, студия, слоган, год
  brandKind: 'plank',
  brandPos: [0, 0],
  weather: null,
  flash: 0,         // вспышка молнии
  title: '',
  objective: '',
  seed: 0,
  startedAt: 0,
  track: -1,
  score: 0,
  nextAuto: 0,
  fade: 1,          // 1 — чёрный экран, дальше проявляется
  shot: 0,          // счётчик «взятых» кадров для счётчика очков
  pops: [],         // всплывающие очки вроде «+100»
  shake: 0,         // тряска камеры от попаданий
};
let NOW = 0;        // время сцены: им живут частицы и всплывающие очки

function newScene(genre, seed, now) {
  const r = mulberry32(seed);
  director.genre = genre;
  director.seed = seed;
  director.palette = makePalette(r, genre);
  director.scene = SCENES[genre].build(r, director.palette);
  director.game = makeGame(r, genre);
  director.title = director.game.title;
  director.objective = GENRES[genre].objective;
  // вывеска: вид и место чуть гуляют от сцены к сцене, чтобы подпись
  // не стояла в одном и том же месте кадра
  director.brandKind = pick(r, BRAND_KIND[genre] || ['plank']);
  const bp = BRAND_POS[genre] || [12, 120];
  director.brandPos = [bp[0] + Math.round(rndRange(r, -5, 5)), bp[1] + Math.round(rndRange(r, -4, 4))];
  director.weather = makeWeather(r, genre, director.palette.time);
  director.startedAt = now;
  director.fade = 1;
  director.shot = 0;
}

function chooseGenre(track, mood, now) {
  const r = mulberry32((director.seed + track * 7919 + 13) >>> 0);
  const mapped = MOOD_GENRE[mood];
  // Обычно жанр подсказан музыкой, но иногда режиссёр удивляет:
  // иначе связка «трек - сцена» читается слишком предсказуемо.
  let genre;
  if (mapped && r() < 0.72) genre = pick(r, mapped);
  else genre = pick(r, GENRE_KEYS);
  if (genre === director.genre) {
    const alt = GENRE_KEYS.filter((k) => k !== director.genre);
    genre = pick(r, alt);
  }
  return genre;
}

function musicState() {
  return typeof globalThis.getMusicState === 'function' ? globalThis.getMusicState() : null;
}

// ---------------------------------------------------------------- интерфейс
function drawHud(P, t) {
  const inScene = t - director.startedAt;
  const soft = rgba(mix(P.sun, P.accent, 0.4), 0.9);

  // цель уровня: появляется после титров, потом сама уходит
  if (inScene > 6.5 && inScene < 19) {
    const k = Math.min(1, (inScene - 6.5) / 0.6) * Math.min(1, (19 - inScene) / 2);
    g.globalAlpha = Math.max(0, Math.min(1, k));
    textCentered(director.objective, VH - 24, rgba(P.sun, 0.72), 1);
    g.globalAlpha = 1;
  }

  // всплывающие очки: поднимаются и гаснут
  for (const p of director.pops) {
    const age = NOW - p.born;
    if (age > 1.5) continue;
    const k = 1 - age / 1.5;
    g.globalAlpha = k;
    text(p.text, p.x, (p.y - age * 11) | 0, rgba(mix(P.sun, P.accent, 0.35), 0.95), 1);
    g.globalAlpha = 1;
  }
  if (director.pops.length) director.pops = director.pops.filter((p) => NOW - p.born <= 1.5);

  if (inScene < 6.5) return;                      // во время титров HUD не мешает
  const ink = rgba(P.ink, 0.85);
  // очки вверху слева, растут как в настоящей игре
  text('SCORE ' + String(Math.floor(director.score)).padStart(6, '0'), 6, 6, ink, 1);
  text('LV ' + String(1 + (director.track & 0xff) % 9).padStart(2, '0'), 6, 15, soft, 1);
  // «этикетка картриджа»: видно, что идёт другая игра, и она уходит сама
  const fade = inScene > 40 ? Math.max(0, 1 - (inScene - 40) / 8) : 1;
  if (fade > 0.02) {
    g.globalAlpha = 0.5 * fade;
    textCentered(director.game.title, 6, rgba(P.sun, 0.85), 1);
    g.globalAlpha = 1;
  }
  // «здоровье» справа
  for (let i = 0; i < 3; i++) {
    const x = VW - 8 - i * 8;
    rect(x, 6, 5, 4, rgba(P.accent, 0.85));
    rect(x + 1, 7, 3, 2, rgba(P.ink, 0.7));
  }
  if (director.genre === 'rpg') {                 // миникарта
    rect(VW - 40, VH - 32, 34, 26, rgba(P.ink, 0.55));
    rect(VW - 39, VH - 31, 32, 24, rgba(mix(P.sky[1], P.ink, 0.3), 0.6));
    const blip = (Math.sin(t * 0.4) * 0.5 + 0.5);
    rect(VW - 39 + blip * 30, VH - 31 + ((t * 3) % 22), 2, 2, rgba(P.accent, 0.95));
  }
  if (director.genre === 'platformer') {          // полоска прогресса уровня
    rect(6, VH - 9, 60, 3, rgba(P.ink, 0.6));
    rect(6, VH - 9, 60 * ((t - director.startedAt) % 30) / 30, 3, rgba(P.accent, 0.8));
  }
  drawPrompt(P, t);
}

// Карточка картриджа: как коробка от игры — студия, название, слоган, год.
function drawTitleCard(P, t) {
  const inScene = t - director.startedAt;
  const showFor = 6.5;
  if (inScene > showFor) return;
  const k = Math.min(1, inScene / 0.6) * Math.min(1, (showFor - inScene) / 0.8);
  g.globalAlpha = Math.max(0, Math.min(1, k));
  const G = director.game;
  const soft = rgba(P.sun, 0.68);
  // кинематографичные полосы
  rect(0, 0, VW, 15, rgb([0, 0, 0]));
  rect(0, VH - 15, VW, 15, rgb([0, 0, 0]));
  // шапка: издатель слева, платформа справа — как на коробке
  text(BRAND + ' PRESENTS', 8, 4, rgba(mix(P.sun, P.accent, 0.35), 0.9), 1);
  const right = G.platform + '  ' + G.rating;
  text(right, VW - 8 - textWidth(right, 1), 4, rgba(P.accent, 0.85), 1);
  // название и идея: с тенью, чтобы читалось и на светлой сцене
  const shadow = rgba(mix(P.ink, [0, 0, 0], 0.4), 0.75);
  textCentered(GENRES[director.genre].label, 49, shadow, 1);
  textCentered(GENRES[director.genre].label, 48, rgba(P.accent, 0.85), 1);
  const sc = textWidth(G.title, 2) <= VW - 44 ? 2 : 1;
  textCentered(G.title, 61, shadow, sc);
  textCentered(G.title, 60, rgba(P.sun, 0.98), sc);
  const lw = Math.min(VW - 76, textWidth(G.tagline, 1) + 34);
  rect(((VW - lw) / 2) | 0, 80, lw, 1, rgba(P.sun, 0.3));
  rect(5, 80, 9, 1, rgba(P.accent, 0.6));
  rect(VW - 14, 80, 9, 1, rgba(P.accent, 0.6));
  textCentered(G.tagline, 86, shadow, 1);
  textCentered(G.tagline, 85, rgba(mix(P.sun, P.accent, 0.4), 0.95), 1);
  // низ: год, старт, автор
  text('(C)' + G.year + ' ' + G.studio, 8, VH - 12, soft, 1);
  const rw = 'DESIGN ' + G.author;
  text(rw, VW - 8 - textWidth(rw, 1), VH - 12, soft, 1);
  if ((t * 1.6) % 2 < 1.25) textCentered('PRESS START', VH - 12, rgba(P.sun, 0.9), 1);
  const dots = '.'.repeat(1 + (Math.floor(t * 2) % 3));
  textCentered('LOADING' + dots, VH - 26, rgba(P.sun, 0.55), 1);
  g.globalAlpha = 1;
}

function drawFrameOverlay(P, t) {
  // виньетка и мягкий тёплый свет — общий лофи-слой поверх любой сцены
  const vg = g.createRadialGradient(VW / 2, VH / 2, VH * 0.35, VW / 2, VH / 2, VH * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(10,8,14,0.55)');
  paint(vg); g.fillRect(0, 0, VW, VH);
  g.globalAlpha = 0.05 + 0.02 * Math.sin(t * 0.7);
  paint(rgb(mix(P.accent, P.sun, 0.5)));
  g.fillRect(0, 0, VW, VH);
  g.globalAlpha = 1;
  // строки развёртки
  for (let y = 0; y < VH; y += 3) rect(0, y, VW, 1, 'rgba(0,0,0,0.07)');
}

// ---------------------------------------------------------------- цикл
// Служебные переключатели для просмотра. На эфир не влияют: в бою они не заданы.
//   ?switch=12   сменить сцену через 12 с, не дожидаясь нового трека
//   ?genre=cyber  показать конкретный жанр
const params = (typeof location !== 'undefined' && location.search)
  ? new URLSearchParams(location.search) : null;
const SWITCH_SEC = Number((globalThis.SCENE_SWITCH_SEC || 0)
  || (params && params.get('switch')) || 0);
const FORCED_GENRE = globalThis.SCENE_FORCE || (params && params.get('genre')) || null;
const AUTO_SEC = SWITCH_SEC > 0 ? SWITCH_SEC : 75;

let last = 0;
function frame(now) {
  let t = now / 1000;
  const dt = Math.min(0.1, Math.max(0, t - last));
  last = t;

  const music = musicState();
  const byMusic = !SWITCH_SEC && music && typeof music.track === 'number';
  const track = byMusic ? music.track : Math.floor(t / AUTO_SEC);
  if (track !== director.track || !director.scene) {
    const mood = music && music.mood ? music.mood : null;
    const seed = ((track + 1) * 2654435761 + Math.floor(t)) >>> 0;
    const genre = (FORCED_GENRE && SCENES[FORCED_GENRE])
      ? FORCED_GENRE
      : chooseGenre(track, mood, t);
    newScene(genre, seed, t);
    director.track = track;
  }

  director.score += dt * (12 + Math.floor(Math.abs(Math.sin(t * 0.3)) * 30));
  director.fade = Math.max(0, director.fade - dt * 1.4);

  const P = director.palette;
  NOW = t;
  // тряска камеры: сцены заявляют её при попаданиях
  let sx = 0, sy = 0;
  if (director.shake > 0) {
    director.shake = Math.max(0, director.shake - dt * 2.4);
    sx = (Math.random() - 0.5) * director.shake * 3.5;
    sy = (Math.random() - 0.5) * director.shake * 2.5;
  }
  g.save();
  g.translate(Math.round(sx), Math.round(sy));
  SCENES[director.genre].draw(director.scene, P, t - director.startedAt, dt);
  // вывеска живёт в мире сцены и дрожит вместе с камерой; во время
  // вступительной карточки её не видно, чтобы не спорить с титрами
  if (t - director.startedAt > 5.4) {
    const bp = director.brandPos;
    brand(bp[0], bp[1], P, director.brandKind, (director.seed & 3) !== 0, t - director.startedAt);
  }
  drawWeather(P, t - director.startedAt, dt);
  g.restore(); resetPaint();
  // молния: короткая вспышка на весь кадр
  if (P.time === 'гроза' && Math.random() < dt * 0.45) director.flash = 1;
  if (director.flash > 0) {
    director.flash = Math.max(0, director.flash - dt * 3.4);
    g.globalAlpha = director.flash * 0.2;
    paint(rgb([240, 244, 255]));
    g.fillRect(0, 0, VW, VH);
    g.globalAlpha = 1;
  }
  drawFrameOverlay(P, t);
  drawHud(P, t);
  drawTitleCard(P, t);

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, OUT_W, OUT_H);
  ctx.drawImage(world, OFF_X, OFF_Y, VW * SCALE, VH * SCALE);
  if (director.fade > 0) {
    ctx.fillStyle = `rgba(0,0,0,${director.fade})`;
    ctx.fillRect(0, 0, OUT_W, OUT_H);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
