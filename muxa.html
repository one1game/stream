// пикселю: замер показал 4.7 мс на небо и ещё 1.8 на солнце из 25 мс кадра.
// Поэтому они пекутся в слой один раз на биом, а в кадре остаётся одна накладка.
let backdrop = null, backdropCtx = null, backdropBiome = -1;
function backdropLayer() {
  if (backdrop && backdropBiome === currentBiome) return backdrop;
  if (!backdrop) {
    backdrop = document.createElement('canvas');
    backdrop.width = W; backdrop.height = H;
    backdropCtx = backdrop.getContext('2d');
  }
  const g = backdropCtx;
  const biome = BIOMES[currentBiome];
  const sky = biome.sky;
  const grad = g.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, sky[0]); grad.addColorStop(0.35, sky[1]);
  grad.addColorStop(0.65, sky[2]); grad.addColorStop(1, sky[3]);
  g.fillStyle = grad; g.fillRect(0, 0, W, H);
  if (biome.name === 'НОЧЬ') drawMoon(W - 180, 140, g);
  else drawSun(W - 180, 140, g);
  backdropBiome = currentBiome;
  return backdrop;
}

// Горы: гряда залитых треугольников — 3.1 мс кадра, потому что каждая заливка
// стоит одинаково независимо от площади. Они не меняются, кроме цвета биома, и
// единственное, что в них движется, — сдвиг от камеры. Поэтому печём полосу и
// кладём её двумя накладками.
//
// Шаг гребня (125 px) делит ширину полосы без остатка — иначе на стыке двух
// накладок узор сбивался бы и в гряде появлялся шов. Сама полоса не короче
// кадра с запасом на заворот: тогда две накладки заведомо закрывают экран.
// Шаг мелкий нарочно: в исходной гряде было два десятка зубцов на две тысячи
// пикселей, то есть один зубец на сотню — гребень выходил плотный, почти
// сплошной, а с шагом в полкилометра между пиками светило небо.
const MOUNTAIN_STEP = 125;
const MOUNTAIN_W = 480;
function mountainColor(biome) {
  return biome.name === 'ВУЛКАН' ? '#4a1a1a' : biome.name === 'НОЧЬ' ? '#1a1a3a' :
         biome.name === 'ПУСТЫНЯ' ? '#a87a4a' : biome.name === 'ЛЬДЫ' ? '#7a9ab8' : '#5a7a9e';
}
let mountainStrip = null, mountainStripBiome = -1;
function mountainLayer() {
  const P = Math.ceil((W + 1000) / MOUNTAIN_STEP) * MOUNTAIN_STEP;
  if (!mountainStrip) {
    mountainStrip = document.createElement('canvas');
    mountainStrip.height = 340;
  }
  if (mountainStrip.width !== P) mountainStrip.width = P;
  if (mountainStripBiome === currentBiome) return mountainStrip;
  const g = mountainStrip.getContext('2d');
  g.clearRect(0, 0, P, 340);
  g.fillStyle = mountainColor(BIOMES[currentBiome]);
  // Высоту вершины берём от номера зубца внутри полосы, а не от Math.random:
  // узор обязан повторяться ровно через полосу, иначе на стыке накладок
  // вырастает зуб другой высоты и по гряде идёт шов. Зубцы у краёв полосы
  // рисуем ещё раз — их половинки лежат по обе стороны стыка.
  const cells = P / MOUNTAIN_STEP;
  for (let k = -3; k <= cells; k++) {
    const x = k * MOUNTAIN_STEP;
    const idx = ((k % cells) + cells) % cells;
    const r = Math.abs(Math.sin(idx * 12.9898) * 43758.5453) % 1;
    g.beginPath();
    g.moveTo(x, 330);
    g.lineTo(x + MOUNTAIN_W / 2, 330 - (110 + 200 * r));
    g.lineTo(x + MOUNTAIN_W, 330);
    g.fill();
  }
  mountainStripBiome = currentBiome;
  return mountainStrip;
}

// Виньетка. Раньше это была заливка во весь кадр градиентом, потом целая
// накладка-слой — и то и другое стоит одинаково дорого, потому что Skia платит
// за каждый пиксель кадра (замер: 3.9 мс). Затемняем только края четырьмя
// полосами: середина кадра остаётся нетронутой, а видно ровно то же самое.
function drawVignette(g) {
  const bands = [
    [0, 0, W, H * 0.16, 0, 0, 0, H * 0.16],          // сверху
    [0, H * 0.84, W, H * 0.16, 0, H, 0, H * 0.84],   // снизу
    [0, 0, W * 0.09, H, 0, 0, W * 0.09, 0],          // слева
    [W * 0.91, 0, W * 0.09, H, W, 0, W * 0.91, 0],   // справа
  ];
  for (const [x, y, w, h, gx0, gy0, gx1, gy1] of bands) {
    const grad = g.createLinearGradient(gx0, gy0, gx1, gy1);
    grad.addColorStop(0, 'rgba(0,0,0,0.34)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad;
    g.fillRect(x, y, w, h);
  }
}

// Плитки земли и дерева: их рисовали градиентами на каждый отрезок кадра,
// а отрезок на экране не один — дешевле испечь плитку и класть её накладкой.
const groundTiles = {};
function groundTile(biomeIdx) {
  if (groundTiles[biomeIdx]) return groundTiles[biomeIdx];
  const pb = BIOMES[biomeIdx] || BIOMES[0];
  const cv = document.createElement('canvas');
  cv.width = SEGMENT; cv.height = 200;
  const g = cv.getContext('2d');
  const dirt = g.createLinearGradient(0, 0, 0, 120);
  dirt.addColorStop(0, pb.dirt); dirt.addColorStop(1, '#1a1008');
  g.fillStyle = dirt; g.fillRect(0, 0, SEGMENT, 200);
  const grass = g.createLinearGradient(0, 0, 0, 22);
  grass.addColorStop(0, pb.ground); grass.addColorStop(1, pb.grass);
  g.fillStyle = grass; g.fillRect(0, 0, SEGMENT, 22);
  g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(0, 0, SEGMENT, 5);
  groundTiles[biomeIdx] = cv;
  return cv;
}

let woodTile = null;
function woodTileLayer() {
  if (woodTile) return woodTile;
  const cv = document.createElement('canvas');
  cv.width = 200; cv.height = 24;
  const g = cv.getContext('2d');
  const wood = g.createLinearGradient(0, 0, 0, 24);
  wood.addColorStop(0, '#a0703d'); wood.addColorStop(0.5, '#8B5A2B'); wood.addColorStop(1, '#5a3818');
  g.fillStyle = wood; g.fillRect(0, 0, 200, 24);
  g.fillStyle = 'rgba(255,220,150,0.5)'; g.fillRect(0, 0, 200, 3);
  woodTile = cv;
  return cv;
}

function draw() {
  ctx.drawImage(backdropLayer(), 0, 0);
  drawBlimp();

  // Гряда идёт медленнее мира и заворачивается по кольцу шириной в полосу.
  // Вторая накладка нужна только когда первая не достаёт до правого края: её
  // левый край — ровно правый край первой. Половину кадров вторая целиком за
  // экраном, и тогда мы её не кладём (замер: одна накладка гряды 1.1 мс).
  const mtn = mountainLayer();
  const mtnP = mtn.width;
  const mtnShift = (((cameraX * 0.15) % mtnP) + mtnP) % mtnP;
  const mtnX = -mtnShift - 500;
  ctx.drawImage(mtn, mtnX, GROUND_Y - 230);
  if (mtnX + mtnP < W) ctx.drawImage(mtn, mtnX + mtnP, GROUND_Y - 230);

  ctx.save();
  ctx.translate(-cameraX, 0);
  for (const key in Brain.deathMemory) {
    const mem = Brain.deathMemory[key];
    const memX = mem.seg * 100;
    if (memX < cameraX - 250 || memX > cameraX + W + 250) continue;
    const alpha = Math.min(0.3, mem.severity * 0.08);
    ctx.fillStyle = 'rgba(255,0,0,' + alpha + ')';
    ctx.beginPath(); ctx.arc(memX, GROUND_Y - 30, 70, 0, Math.PI * 2); ctx.fill();
  }
  for (const p of world.platforms) {
    if (p.x + p.w < cameraX - 150 || p.x > cameraX + W + 150) continue;
    if (p.ground) {
      // Земля — две заливки с градиентами на каждый отрезок (замер: 2 мс кадра).
      // Печём плитку на биом: отрезков на экране несколько, и все одного размера.
      // Ширину берём у платформы, а не у плитки: у холма она втрое уже, и раньше
      // плитка уезжала на 209 px правее — трава рисовалась там, где коллизии нет.
      ctx.drawImage(groundTile(p.biome !== undefined ? p.biome : 0), p.x, p.y, p.w, 200);
    } else {
      ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(p.x + 3, p.y + p.h - 3, p.w, 5);
      ctx.drawImage(woodTileLayer(), p.x, p.y, p.w, p.h);
    }
  }
  // Декор кладём поверх земли, а не под неё: раньше тень и низ ствола срезало
  // полотном земли, и деревья стояли «по колено» в грунте.
  for (const d of world.decorations) {
    if (d.x < cameraX - 250 || d.x > cameraX + W + 250) continue;
    drawDecoration(d);
  }
  for (const h of world.hazards) {
    if (h.x + h.w < cameraX - 100 || h.x > cameraX + W + 100) continue;
    if (h.type === 'lava') {
      const lg = ctx.createLinearGradient(0, h.y, 0, h.y + h.h);
      lg.addColorStop(0, '#ff8a2a'); lg.addColorStop(0.5, '#ff4400'); lg.addColorStop(1, '#8a1a00');
      ctx.fillStyle = lg;
      ctx.beginPath();
      const wobble = Math.sin(h.anim) * 2;
      ctx.moveTo(h.x, h.y + h.h);
      for (let i = 0; i <= h.w; i += 6) ctx.lineTo(h.x + i, h.y + wobble * Math.sin(i * 0.1 + h.anim));
      ctx.lineTo(h.x + h.w, h.y + h.h); ctx.closePath(); ctx.fill();
      ctx.shadowColor = '#ff4400'; ctx.shadowBlur = 20;
      ctx.fillStyle = 'rgba(255,100,0,0.3)'; ctx.fillRect(h.x, h.y, h.w, h.h);
      ctx.shadowBlur = 0;
    } else if (h.type === 'sand') {
      // Песчаная яма пустыни. Раньше падала в ветку лавы и красилась огнём:
      // в пустыне из земли били оранжевые сполохи.
      const sg = ctx.createLinearGradient(0, h.y, 0, h.y + h.h);
      sg.addColorStop(0, '#f0d79a'); sg.addColorStop(0.5, '#c9a468'); sg.addColorStop(1, '#7a5a30');
      ctx.fillStyle = sg;
      ctx.beginPath();
      const wobble = Math.sin(h.anim) * 2;
      ctx.moveTo(h.x, h.y + h.h);
      for (let i = 0; i <= h.w; i += 6) ctx.lineTo(h.x + i, h.y + wobble * Math.sin(i * 0.1 + h.anim));
      ctx.lineTo(h.x + h.w, h.y + h.h); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,240,200,0.35)'; ctx.fillRect(h.x, h.y, h.w, h.h);
    } else if (h.type === 'ice') {
      ctx.fillStyle = '#a8e0f8';
      ctx.beginPath();
      for (let i = 0; i < h.w; i += 10) {
        ctx.moveTo(h.x + i, h.y + h.h); ctx.lineTo(h.x + i + 5, h.y); ctx.lineTo(h.x + i + 10, h.y + h.h);
      }
      ctx.fill();
    } else {
      ctx.fillStyle = '#888';
      ctx.beginPath();
      const cnt = 4, sw = h.w / cnt;
      for (let i = 0; i < cnt; i++) {
        ctx.moveTo(h.x + i * sw, h.y + h.h); ctx.lineTo(h.x + i * sw + sw / 2, h.y); ctx.lineTo(h.x + (i + 1) * sw, h.y + h.h);
      }
      ctx.fill();
    }
  }
  for (const c of world.coins) {
    if (c.taken) continue;
    if (c.x < cameraX - 60 || c.x > cameraX + W + 60) continue;
    const bob = Math.sin(c.anim) * 5;
    const cx = c.x, cy = c.y + bob;
    const gg = ctx.createRadialGradient(cx, cy, 2, cx, cy, 25);
    gg.addColorStop(0, 'rgba(255,220,80,0.7)'); gg.addColorStop(1, 'rgba(255,220,80,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(cx, cy, 25, 0, Math.PI * 2); ctx.fill();
    const cg = ctx.createRadialGradient(cx - 3, cy - 3, 2, cx, cy, c.r);
    cg.addColorStop(0, '#fff8b0'); cg.addColorStop(0.5, '#ffd93d'); cg.addColorStop(1, '#c88a00');
    ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(cx, cy, c.r, 0, Math.PI * 2); ctx.fill();
  }
  for (const d of world.drops) {
    if (d.x < cameraX - 60 || d.x > cameraX + W + 60) continue;
    drawDrop(d);
  }
  for (const e of world.enemies) {
    if (!e.alive) continue;
    if (e.x + e.w < cameraX - 150 || e.x > cameraX + W + 150) continue;
    if (e.hurtFlash > 0 && Math.floor(e.hurtFlash / 50) % 2 === 0) continue;
    drawEnemy(e);
  }
  for (const b of world.bullets) {
    const glow = ctx.createRadialGradient(b.x, b.y, 0, b.x, b.y, 14);
    if (b.infinite) {
      glow.addColorStop(0, 'rgba(255,255,200,1)'); glow.addColorStop(0.4, 'rgba(255,240,100,0.9)'); glow.addColorStop(1, 'rgba(255,200,0,0)');
    } else {
      glow.addColorStop(0, 'rgba(255,240,150,1)'); glow.addColorStop(0.4, 'rgba(255,200,50,0.9)'); glow.addColorStop(1, 'rgba(255,150,0,0)');
    }
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(b.x, b.y, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fffbe0'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = b.infinite ? 'rgba(255,240,100,0.7)' : 'rgba(255,200,50,0.5)';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(b.x, b.y); ctx.lineTo(b.x - b.vx * 0.8, b.y - b.vy * 0.8); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of world.particles) {
    const a = p.life / p.maxLife;
    ctx.globalAlpha = Math.max(0, a) * 0.9;
    const gg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
    gg.addColorStop(0, p.color); gg.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
  drawPlayer();
  ctx.restore();

  drawVignette(ctx);

  if (finished) {
    ctx.fillStyle = 'rgba(0,0,0,0.9)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#ffd93d'; ctx.font = 'bold 60px monospace'; ctx.textAlign = 'center';
    ctx.shadowColor = '#ff9a00'; ctx.shadowBlur = 25;
    ctx.fillText('ПРОХОЖДЕНИЕ ЗАВЕРШЕНО!', W / 2, H / 2 - 70);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#fff'; ctx.font = '24px monospace';
    ctx.fillText('5 часов непрерывной игры пройдено', W / 2, H / 2 + 10);
    ctx.fillText('Финальный навык: ' + Brain.skill.name + ' (' + Brain.skill.level + ')', W / 2, H / 2 + 50);
    ctx.fillText('Убито: ' + player.kills + ' | Смертей: ' + Brain.deaths + ' | Комбо: x' + Brain.stats.longestCombo, W / 2, H / 2 + 90);
  }
}

function drawBlimp() {
  const px = W * blimp.offsetX + blimp.x - cameraX * 0.05;
  const wrapX = ((px % (W * 1.5)) + W * 1.5) % (W * 1.5) - W * 0.25;
  const py = H * blimp.offsetY + Math.sin(blimp.drift) * 3;
  ctx.save();
  ctx.translate(wrapX, py);
  ctx.scale(blimp.scale, blimp.scale);
  ctx.rotate(Math.sin(blimp.drift * 0.7) * 0.03);
  // Тень раньше рисовалась внутри scale()/rotate() корпуса и уезжала посреди
  // неба, да и вовсе была невидима: земля кладётся позже и накрывает её.
  const bodyGrad = ctx.createLinearGradient(0, -35, 0, 35);
  bodyGrad.addColorStop(0, '#e8e0d0'); bodyGrad.addColorStop(0.3, '#d8d0c0');
  bodyGrad.addColorStop(0.7, '#c8b8a0'); bodyGrad.addColorStop(1, '#a89a80');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath(); ctx.ellipse(0, 0, 80, 32, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = 'rgba(80,60,40,0.5)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.ellipse(0, 0, 80, 32, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.fillStyle = 'rgba(180,60,40,0.7)'; ctx.fillRect(-70, -6, 140, 4);
  ctx.fillStyle = 'rgba(80,60,40,0.4)'; ctx.fillRect(-70, 6, 140, 2);

function drawPlayer() {
  const x = player.x, y = player.y;
  if (player.invuln > 0 && !hasInvulnBuff() && Math.floor(player.invuln / 60) % 2 === 0) return;
  const wp = Math.sin(player.animation) * 4;
  const isJ = !player.onGround, isA = player.attacking, isH = player.state === 'hurt';
  if (hasInvulnBuff()) {
    const pulse = 1 + Math.sin(now() * 0.01) * 0.15;
    const auraGrad = ctx.createRadialGradient(x + player.w / 2, y + player.h / 2, 15, x + player.w / 2, y + player.h / 2, 55 * pulse);
    auraGrad.addColorStop(0, 'rgba(79,195,247,0.4)'); auraGrad.addColorStop(0.6, 'rgba(79,195,247,0.2)'); auraGrad.addColorStop(1, 'rgba(79,195,247,0)');
    ctx.fillStyle = auraGrad; ctx.beginPath(); ctx.arc(x + player.w / 2, y + player.h / 2, 55 * pulse, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = 'rgba(79,195,247,' + (0.5 + Math.sin(now() * 0.02) * 0.3) + ')';
    ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(x + player.w / 2, y + player.h / 2, 45 * pulse, 0, Math.PI * 2); ctx.stroke();
  }
  if (hasInfiniteAmmo()) {
    const pulse = 1 + Math.sin(now() * 0.008) * 0.1;
    const auraGrad = ctx.createRadialGradient(x + player.w / 2, y + player.h / 2, 10, x + player.w / 2, y + player.h / 2, 40 * pulse);
    auraGrad.addColorStop(0, 'rgba(255,217,61,0.3)'); auraGrad.addColorStop(0.7, 'rgba(255,217,61,0.15)'); auraGrad.addColorStop(1, 'rgba(255,217,61,0)');
    ctx.fillStyle = auraGrad; ctx.beginPath(); ctx.arc(x + player.w / 2, y + player.h / 2, 40 * pulse, 0, Math.PI * 2); ctx.fill();
    for (let i = 0; i < 4; i++) {
      const angle = now() * 0.003 + i * Math.PI / 2;
      const rad = 35;
      const sx = x + player.w / 2 + Math.cos(angle) * rad;
      const sy = y + player.h / 2 + Math.sin(angle) * rad;
      ctx.fillStyle = 'rgba(255,217,61,0.8)'; ctx.beginPath(); ctx.arc(sx, sy, 2, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath(); ctx.ellipse(x + player.w / 2, y + player.h + 5, 22, 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a2530';
  // Лапки шагают вверх от земли: Math.max(0, ...) — иначе нога уходит на 4 px
  // ниже хитбокса, то есть в землю.
  if (isJ) { ctx.fillRect(x + 5, y + 40, 10, 18); ctx.fillRect(x + 20, y + 40, 10, 18); }
  else {
    ctx.fillRect(x + 5, y + 42 - Math.max(0, wp), 10, 18);
    ctx.fillRect(x + 20, y + 42 - Math.max(0, -wp), 10, 18);
  }
  const bg = ctx.createLinearGradient(x, y + 15, x, y + 45);
  if (isH) { bg.addColorStop(0, '#ffaaaa'); bg.addColorStop(1, '#cc4444'); }
  else { bg.addColorStop(0, '#ff5c5c'); bg.addColorStop(1, '#b02828'); }
  ctx.fillStyle = bg; ctx.fillRect(x + 4, y + 15, player.w - 8, 30);
  ctx.fillStyle = 'rgba(255,255,255,0.25)'; ctx.fillRect(x + 6, y + 16, player.w - 12, 6);
  if (player.combo > 0) {
    ctx.fillStyle = '#ffd93d'; ctx.font = 'bold 18px monospace'; ctx.textAlign = 'center';
    ctx.fillText('x' + player.combo, x + player.w / 2, y - 10);
  }
  const hg = ctx.createRadialGradient(x + player.w / 2 - 4, y + 8, 3, x + player.w / 2, y + 12, 18);
  hg.addColorStop(0, '#ffee88'); hg.addColorStop(1, isH ? '#ccaa44' : '#d4a017');
  ctx.fillStyle = hg; ctx.fillRect(x + 6, y + 3, player.w - 12, 18);
  ctx.fillStyle = '#000';
  ctx.fillRect(x + 14, y + 8, 4, 4); ctx.fillRect(x + 22, y + 8, 4, 4);
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 14, y + 8, 1, 1); ctx.fillRect(x + 22, y + 8, 1, 1);
  ctx.fillStyle = '#000'; ctx.fillRect(x + 16, y + 15, 8, 2);
  if (player.ammo > 0 && !hasInfiniteAmmo() && player.shootCooldown > SHOOT_CD * 0.5) {
    ctx.fillStyle = '#ffd93d'; ctx.beginPath(); ctx.arc(x + player.w + 5, y + 20, 6, 0, Math.PI * 2); ctx.fill();
  }
  if (isA) {
    // Меч рисуем в ту же сторону, куда бьёт attackRect: в откате (facing -1)
    // клинок раньше оставался справа и расходился с ударом.
    ctx.save();
    if (player.facing < 0) {
      const mid = x + player.w / 2;
      ctx.translate(mid, 0); ctx.scale(-1, 1); ctx.translate(-mid, 0);
    }
    const phase = 1 - player.attackTimer / ATTACK_TIME;
    const sx = x + player.w + 5 + Math.sin(phase * Math.PI) * 8;
    const sy = y + 10 + Math.sin(phase * Math.PI) * 10;
    ctx.shadowColor = '#fff'; ctx.shadowBlur = 15;
    const bgr = ctx.createLinearGradient(sx, sy, sx, sy + 5);
    bgr.addColorStop(0, '#ffffff'); bgr.addColorStop(1, '#aab0c0');
    ctx.fillStyle = bgr; ctx.fillRect(sx, sy, 36, 5);
    ctx.fillStyle = '#8B5A2B'; ctx.fillRect(sx + 30, sy - 3, 8, 11);
    ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(255,255,255,' + (1 - phase) + ')';
    ctx.beginPath(); ctx.arc(x + player.w + 20, y + 22, 30 * phase, -Math.PI / 2, Math.PI / 2); ctx.fill();
    ctx.restore();
  }
}

const streamerCanvas = document.getElementById('streamerCanvas');

const streamer = {
  blinkTimer: 0,        // для моргания
  isBlinking: false,
  mouthOpen: 0,         // 0..1 для эмоций
  excitement: 0,        // 0..1
  panic: 0,             // 0..1
  eyeX: 0, eyeY: 0,     // смещение зрачков
  legPhase: 0,
  lastHp: 100,
  lastDeaths: 0,
  lastCombo: 0,
  reactionText: '',
  reactionTimer: 0,
  // Для реакции на игру
  lastPlayerX: 140,
  airTime: 0,
  onGroundFrames: 0
};

function updateStreamer(dt) {
  const S = streamer;
  const prevReaction = S.reactionText;

  // Реакции на события игры
  if (player.hp < S.lastHp - 5) {
    // Получил урон — паника
    S.panic = 1;
    S.mouthOpen = 1;
    S.reactionText = ['ОЙ!', 'АЙ!', 'БОЛЬНО!', 'НЕЕЕТ!'][Math.floor(Math.random() * 4)];
    S.reactionTimer = 900;
  }
  S.lastHp = player.hp;

  if (Brain.deaths > S.lastDeaths) {
    S.panic = 1;
    S.excitement = 0.3;
    S.mouthOpen = 1;
    S.reactionText = ['БЛИН!', 'ЧЁ ЗА...', 'ОПЯТЬ!', 'Я ЖЕ МОГУ!'][Math.floor(Math.random() * 4)];
    S.reactionTimer = 1500;
  }
  S.lastDeaths = Brain.deaths;

  if (player.combo > S.lastCombo && player.combo >= 3) {
    S.excitement = 1;
    S.mouthOpen = 1;
    S.reactionText = ['КОМБО x' + player.combo + '!', 'ЖАРА!', 'ИДЁТ!', 'ПОШЛА ЖАРА!'][Math.floor(Math.random() * 4)];
    S.reactionTimer = 900;
  }
  S.lastCombo = player.combo;

  // Убийство — радость
  if (Brain.totalKills > (S._lastKills || 0)) {
    S.excitement = Math.min(1, S.excitement + 0.4);
    if (Math.random() < 0.3) {
      S.reactionText = ['+1!', 'ИЗИ!', 'ГОТОВ!', 'GG!'][Math.floor(Math.random() * 4)];
      S.reactionTimer = 500;
    }
  }
  S._lastKills = Brain.totalKills;

  // Плавное затухание эмоций
  S.panic *= 0.96;
  S.excitement *= 0.97;
  S.mouthOpen *= 0.95;
  if (S.reactionTimer > 0) S.reactionTimer -= dt;
  if (S.reactionTimer <= 0) S.reactionText = '';
  if (S.reactionText && S.reactionText !== prevReaction) speakReaction(S.reactionText);

  // Моргание раз в 2-5 секунд
  S.blinkTimer -= dt;
  if (S.blinkTimer <= 0) {
    S.isBlinking = true;
    S.blinkTimer = 100;
    if (!S._blinkDone) {
      S._blinkDone = true;
      setTimeout(() => { S.isBlinking = false; S._blinkDone = false; }, 120);
      S.blinkTimer = 2000 + Math.random() * 3000;
    }
  }

  // Блик-«зрачок» следит за ходом игры. По горизонтали позиция героя на экране
  // не меняется (камера едет за ним), поэтому раньше блик стоял на месте —
  // ведём его по разбегу и откату, а по вертикали — по высоте героя.
  const playerScreenY = player.y / H;
  const targetEyeX = clamp(player.facing * 1.5 + player.vx * 0.9, -5, 5);
  const targetEyeY = clamp((playerScreenY - 0.5) * 6, -4, 4);
  S.eyeX += (targetEyeX - S.eyeX) * 0.15;
  S.eyeY += (targetEyeY - S.eyeY) * 0.15;

  // Лапки двигаются как будто на клавиатуре
  S.legPhase += 0.3 + S.excitement * 0.5 + S.panic * 0.7;

  // Воздух/земля
  if (player.onGround) S.onGroundFrames++;
  else S.onGroundFrames = 0;
}

// Гексагональная упаковка фасеток мушиного глаза — считается один раз
const EYE_R = 15;
const eyeFacets = (() => {
  const facets = [];
  const step = 3.2;
  const rowH = step * 0.87;
  for (let row = -6; row <= 6; row++) {
    const y = row * rowH;
    const xOffset = (row % 2 === 0) ? 0 : step / 2;
    for (let col = -6; col <= 6; col++) {
      const x = col * step + xOffset;
      const d = Math.sqrt(x * x + y * y);
      if (d <= EYE_R - 0.5) facets.push({ x, y, d, a: Math.atan2(y, x) });
    }
  }
  return facets;
})();

function drawFlyEye(S, ex, eyeY, blinking) {
  if (blinking) {
    sCtx.fillStyle = '#2a0a14';
    sCtx.beginPath();
    sCtx.ellipse(ex, eyeY, EYE_R, 2, 0, 0, Math.PI * 2);
    sCtx.fill();
    return;
  }
  // Купол глаза
  const domeGrad = sCtx.createRadialGradient(ex - 4, eyeY - 5, 1, ex, eyeY, EYE_R);
  domeGrad.addColorStop(0, '#7a2438');
  domeGrad.addColorStop(0.55, '#4a1424');
  domeGrad.addColorStop(1, '#230a14');
  sCtx.fillStyle = domeGrad;
  sCtx.beginPath();
  sCtx.arc(ex, eyeY, EYE_R, 0, Math.PI * 2);
  sCtx.fill();

  // Перламутровый отлив по фасеткам (структурная окраска хитина)
  const shimmer = now() * 0.0006;
  for (const f of eyeFacets) {
    const hue = (200 + Math.sin(f.a * 3 + shimmer) * 40 + 160) % 360;
    const shade = 0.35 + 0.5 * (1 - f.d / EYE_R) + Math.sin(f.a * 5 + shimmer * 2) * 0.08;
    sCtx.fillStyle = `hsla(${hue}, 55%, ${28 + shade * 20}%, ${0.3 + shade * 0.25})`;
    sCtx.beginPath();
    sCtx.arc(ex + f.x, eyeY + f.y, 1.4, 0, Math.PI * 2);
    sCtx.fill();
  }

  // Направленный блик вместо зрачка — глаз следит за игроком без "человеческого" вида
  const hlx = ex + S.eyeX * 1.4;
  const hly = eyeY + S.eyeY * 1.2;
  const hlGrad = sCtx.createRadialGradient(hlx, hly, 0, hlx, hly, 6);
  hlGrad.addColorStop(0, 'rgba(255,255,255,0.5)');
  hlGrad.addColorStop(1, 'rgba(255,255,255,0)');
  sCtx.fillStyle = hlGrad;
  sCtx.beginPath();
  sCtx.arc(hlx, hly, 6, 0, Math.PI * 2);
  sCtx.fill();

  sCtx.strokeStyle = 'rgba(0,0,0,0.45)';
  sCtx.lineWidth = 1;
  sCtx.beginPath();
  sCtx.arc(ex, eyeY, EYE_R, 0, Math.PI * 2);
  sCtx.stroke();
}

function drawStreamer(dt) {
  const S = streamer;
  // Фон «комнаты» — радиальный градиент на весь кадр вебки, каждый кадр заново.
  // Печём один раз: он не меняется.
  sCtx.drawImage(flyRoomLayer(), 0, 0);

  // Тень мухи на "столе"
  sCtx.fillStyle = 'rgba(0,0,0,0.4)';
  sCtx.beginPath();
  sCtx.ellipse(SW / 2, SH - 30, 60, 12, 0, 0, Math.PI * 2);
  sCtx.fill();

  // ============ МУХА ============
  const cx = SW / 2;
  const cy = SH / 2 + 10;
  // Тряска при панике
  const shakeX = S.panic > 0.3 ? (Math.random() - 0.5) * S.panic * 8 : 0;
  const shakeY = S.panic > 0.3 ? (Math.random() - 0.5) * S.panic * 6 : 0;
  sCtx.save();
  sCtx.translate(cx + shakeX, cy + shakeY);

  // Крылья (за телом) — быстро машут при возбуждении
  const wingPhase = now() * (0.02 + S.excitement * 0.03);
  const wingAngle = Math.sin(wingPhase) * 0.4;

  function drawWing(mirror) {
    sCtx.save();
    sCtx.translate(25 * mirror, -30);
    sCtx.rotate(mirror * (0.5 - wingAngle * mirror));
    const wingGrad = sCtx.createLinearGradient(-18, -8, 20, 8);
    wingGrad.addColorStop(0, 'rgba(210,225,255,0.15)');
    wingGrad.addColorStop(0.6, 'rgba(200,215,255,0.32)');
    wingGrad.addColorStop(1, 'rgba(170,190,230,0.4)');
    sCtx.fillStyle = wingGrad;
    sCtx.beginPath();
    sCtx.ellipse(0, 0, 22, 10, 0, 0, Math.PI * 2);
    sCtx.fill();
    sCtx.strokeStyle = 'rgba(140,160,200,0.55)';
    sCtx.lineWidth = 1;
    sCtx.stroke();
    // Прожилки крыла
    sCtx.strokeStyle = 'rgba(100,110,140,0.5)';
    sCtx.lineWidth = 0.7;
    sCtx.beginPath();
    sCtx.moveTo(-18, 0); sCtx.quadraticCurveTo(0, -4, 19, -1);
    sCtx.moveTo(-16, 3); sCtx.quadraticCurveTo(-2, 4, 16, 4);
    sCtx.moveTo(-14, -4); sCtx.lineTo(-2, 4);
    sCtx.moveTo(2, -5); sCtx.lineTo(10, 5);
    sCtx.stroke();
    sCtx.restore();
  }
  drawWing(-1);
  drawWing(1);

  // Гальтеры (жужжальца) — маленькие булавовидные органы позади крыльев.
  // Выносим их за силуэт тела: на ±14/-14 они целиком уходили под тело
  // (эллипс 42x38) и в кадре их не было вовсе.
  sCtx.fillStyle = 'rgba(78,66,54,0.95)';
  sCtx.strokeStyle = 'rgba(78,66,54,0.95)';
  sCtx.lineWidth = 1.4;
  for (const s of [-1, 1]) {
    const hx = s * 34, hy = -10;
    sCtx.beginPath();
    sCtx.moveTo(hx, hy);
    sCtx.lineTo(hx + s * 18, hy + 12);
    sCtx.stroke();
    sCtx.beginPath();
    sCtx.arc(hx + s * 18, hy + 12, 3, 0, Math.PI * 2);
    sCtx.fill();
  }

  // Тело мухи (тёмное, пушистое)
  const bodyGrad = sCtx.createRadialGradient(-8, -8, 5, 0, 0, 50);
  bodyGrad.addColorStop(0, '#4a4a52');
  bodyGrad.addColorStop(0.7, '#2a2a32');
  bodyGrad.addColorStop(1, '#1a1a22');
  sCtx.fillStyle = bodyGrad;
  sCtx.beginPath();
  sCtx.ellipse(0, 0, 42, 38, 0, 0, Math.PI * 2);
  sCtx.fill();

  // Полоски на теле мухи
  sCtx.strokeStyle = 'rgba(0,0,0,0.5)';
  sCtx.lineWidth = 2;
  sCtx.beginPath();
  sCtx.ellipse(0, 0, 42, 12, 0, 0, Math.PI * 2);
  sCtx.stroke();
  sCtx.beginPath();
  sCtx.ellipse(0, 0, 42, 24, 0, 0, Math.PI * 2);
  sCtx.stroke();

  // Пушистость (мелкие волоски)
  sCtx.strokeStyle = 'rgba(60,60,70,0.8)';
  sCtx.lineWidth = 1;
  for (let i = 0; i < 20; i++) {
    const angle = (i / 20) * Math.PI * 2;
    const x1 = Math.cos(angle) * 42;
    const y1 = Math.sin(angle) * 38;
    const x2 = Math.cos(angle) * 48;
    const y2 = Math.sin(angle) * 44;
    sCtx.beginPath();
    sCtx.moveTo(x1, y1);
    sCtx.lineTo(x2, y2);
    sCtx.stroke();
  }

  // Блик на теле
  sCtx.fillStyle = 'rgba(150,150,170,0.4)';
  sCtx.beginPath();
  sCtx.ellipse(-15, -15, 12, 8, -0.5, 0, Math.PI * 2);
  sCtx.fill();

  // Металлический перелив хитина (как у настоящей мухи — зеленовато-фиолетовый отлив)
  const shimmerT = now() * 0.0009;
  sCtx.save();
  sCtx.beginPath();
  sCtx.ellipse(0, 0, 42, 38, 0, 0, Math.PI * 2);
  sCtx.clip();
  const irid = sCtx.createLinearGradient(-40, -30, 40, 30);
  irid.addColorStop(0, `hsla(${(150 + Math.sin(shimmerT) * 30) % 360},55%,45%,0.10)`);
  irid.addColorStop(0.5, `hsla(${(260 + Math.sin(shimmerT + 1) * 30) % 360},50%,40%,0.08)`);
  irid.addColorStop(1, `hsla(${(320 + Math.sin(shimmerT + 2) * 30) % 360},50%,45%,0.10)`);
  sCtx.fillStyle = irid;
  sCtx.fillRect(-45, -45, 90, 90);
  sCtx.restore();

  // ============ ГЛАЗА ============
  // Огромные фасеточные глаза, занимающие большую часть головы, без "человеческих" зрачков/бровей
  const eyeY = -8;
  const eyeSpacing = 15;
  for (let side = -1; side <= 1; side += 2) {
    drawFlyEye(S, side * eyeSpacing, eyeY, S.isBlinking);
  }

  // ============ РОТ ============
  const mouthY = 18;
  // Рот открывается при разговоре/эмоциях
  const mouthHeight = 4 + S.mouthOpen * 14;

  if (mouthHeight > 6) {
    // Открытый рот
    sCtx.fillStyle = '#000';
    sCtx.beginPath();
    sCtx.ellipse(0, mouthY, 12, mouthHeight, 0, 0, Math.PI * 2);
    sCtx.fill();
    // Язычок
    sCtx.fillStyle = '#c04040';
    sCtx.beginPath();
    sCtx.ellipse(0, mouthY + mouthHeight * 0.3, 7, mouthHeight * 0.4, 0, 0, Math.PI * 2);
    sCtx.fill();
  } else {
    // Улыбка/простая линия
    sCtx.strokeStyle = '#000';
    sCtx.lineWidth = 2;
    sCtx.beginPath();
    if (S.excitement > 0.3) {
      // Широкая улыбка
      sCtx.arc(0, mouthY - 4, 10, 0.2, Math.PI - 0.2);
    } else {
      // Прямая линия
      sCtx.moveTo(-8, mouthY);
      sCtx.lineTo(8, mouthY);
    }
    sCtx.stroke();
  }

  // ============ УСИКИ ============
  sCtx.strokeStyle = '#1a1a22';
  sCtx.lineWidth = 2;
  const antennaWiggle = Math.sin(now() * 0.005 + S.excitement * 5) * 3;
  // Левый усик
  sCtx.beginPath();
  sCtx.moveTo(-18, -32);
  sCtx.quadraticCurveTo(-30, -60 + antennaWiggle, -35, -75);
  sCtx.stroke();
  sCtx.fillStyle = '#1a1a22';
  sCtx.beginPath();
  sCtx.arc(-35, -75, 3, 0, Math.PI * 2);
  sCtx.fill();
  // Правый усик
  sCtx.beginPath();
  sCtx.moveTo(18, -32);
  sCtx.quadraticCurveTo(30, -60 - antennaWiggle, 35, -75);
  sCtx.stroke();
  sCtx.beginPath();
  sCtx.arc(35, -75, 3, 0, Math.PI * 2);
  sCtx.fill();

  // ============ ЛАПКИ (жмут клавиши) ============
  // Передние лапки на "клавиатуре" перед мухой
  const legY = 40;
  const legPhase1 = Math.sin(S.legPhase) * 8;
  const legPhase2 = Math.sin(S.legPhase + 1.5) * 8;
  const legPhase3 = Math.sin(S.legPhase + 3) * 6;

  sCtx.strokeStyle = '#1a1a22';
  sCtx.lineWidth = 3;
  sCtx.lineCap = 'round';

  // Левая передняя лапка
  sCtx.beginPath();
  sCtx.moveTo(-25, 25);
  sCtx.quadraticCurveTo(-35, legY - 10 + legPhase1, -35, legY + legPhase1);
  sCtx.stroke();
  // Правая передняя лапка
  sCtx.beginPath();
  sCtx.moveTo(25, 25);
  sCtx.quadraticCurveTo(35, legY - 10 + legPhase2, 35, legY + legPhase2);
  sCtx.stroke();
  // Средние лапки
  sCtx.beginPath();
  sCtx.moveTo(-30, 10);
  sCtx.quadraticCurveTo(-42, 25 + legPhase3, -45, 35 + legPhase3);
  sCtx.stroke();
  sCtx.beginPath();
  sCtx.moveTo(30, 10);
  sCtx.quadraticCurveTo(42, 25 - legPhase3, 45, 35 - legPhase3);
  sCtx.stroke();

  sCtx.lineCap = 'butt';

  // ============ МИКРОФОН ============
  // Микрофон перед мухой
  sCtx.save();
  sCtx.translate(-60, 30);
  // Стойка
  sCtx.strokeStyle = '#222';
  sCtx.lineWidth = 3;
  sCtx.beginPath();
  sCtx.moveTo(0, 0);
  sCtx.lineTo(0, 40);
  sCtx.stroke();
  // Тело микрофона
  sCtx.fillStyle = '#444';
  sCtx.beginPath();
  sCtx.ellipse(0, -5, 6, 12, 0, 0, Math.PI * 2);
  sCtx.fill();
  // Решётка
  sCtx.fillStyle = '#666';
  sCtx.beginPath();
  sCtx.ellipse(0, -10, 5, 6, 0, 0, Math.PI * 2);
  sCtx.fill();
  sCtx.strokeStyle = '#222';
  sCtx.lineWidth = 0.5;
  for (let i = 0; i < 3; i++) {
    sCtx.beginPath();
    sCtx.moveTo(-5, -12 + i * 3);
    sCtx.lineTo(5, -12 + i * 3);
    sCtx.stroke();
  }
  sCtx.restore();

  sCtx.restore(); // восстановить из тряски

  // ============ РЕАКЦИЯ (текст) ============
  if (S.reactionText && S.reactionTimer > 0) {
    const alpha = Math.min(1, S.reactionTimer / 300);
    const bounce = Math.sin(now() * 0.02) * 3;
    sCtx.save();
    sCtx.globalAlpha = alpha;
    sCtx.fillStyle = '#ff3860';
    sCtx.strokeStyle = '#fff';
    sCtx.lineWidth = 3;
    // Круглая маска вебки узкая у краёв кадра: буквы на 22 px срезались по
    // дуге, поэтому строку держим ниже и мельче, где круг широкий.
    sCtx.font = 'bold 20px Courier New';
    sCtx.textAlign = 'center';
    sCtx.strokeText(S.reactionText, SW / 2, 46 + bounce);
    sCtx.fillText(S.reactionText, SW / 2, 46 + bounce);
    sCtx.restore();
  }

  // ============ ИНДИКАТОР ЭМОЦИЙ ============
  // Полоска «стрим-энергии». Раньше лежала на самой кромке кадра: круглая маска
  // оставляла от неё тридцать пикселей из двухсот сорока. Держим над нижней
  // плашкой, где круг широкий.
  const barW = SW * 0.6, barX = (SW - barW) / 2, barY = SH - 30, barH = 6;
  sCtx.fillStyle = 'rgba(0,0,0,0.5)';
  sCtx.fillRect(barX, barY, barW, barH);
  const energy = Math.min(1, (S.excitement + S.panic + (player.combo / 10)) / 2);
  const energyGrad = sCtx.createLinearGradient(barX, 0, barX + barW, 0);
  energyGrad.addColorStop(0, '#7CFC00');
  energyGrad.addColorStop(0.5, '#ffd93d');
  energyGrad.addColorStop(1, '#ff3860');
  sCtx.fillStyle = energyGrad;
  sCtx.fillRect(barX, barY, barW * energy, barH);

  // Нижняя плашка "СЕЙЧАС В ЭФИРЕ"
  sCtx.fillStyle = 'rgba(0,0,0,0.6)';
  sCtx.fillRect(0, SH - 18, SW, 18);
  sCtx.fillStyle = '#fff';
  sCtx.font = 'bold 11px Courier New';
  sCtx.textAlign = 'center';
  const statusText = S.panic > 0.4 ? 'ПАНИКА!' :
                     S.excitement > 0.5 ? 'ХАЙП!' :
                     player.combo > 2 ? 'КОМБО!' : 'PLAY';
  sCtx.fillText(statusText, SW / 2, SH - 5);
}

// ================================================================
// ============ HUD И ВЕБКА НА ХОЛСТЕ =============================
// ================================================================
// Раньше это была разметка поверх канваса: в браузере она видна, а в эфире
// страницы нет — только кадр. Поэтому те же строки, полоса прогресса и круглая
// вебка мухи рисуются прямо на холсте: браузер и эфир показывают одно и то же.
const hud = {
  hp: 100, dist: 0, kills: 0, ammo: '0', deaths: 0, combo: 0, time: '0:00',
  buffs: [], progress: 0
};

// Подписи HUD (HP, Дистанция, …) не меняются, а текста в кадре немало: замер
// показал 2.8 мс. Печём подписи вместе с их тенями в небольшой слой — в кадре
// остаётся одна накладка и только цифры.
const HUD_LABELS = ['HP:', 'Дистанция:', 'Убито:', 'Патроны:', 'Смертей:', 'Комбо:', 'Время:'];
let hudLabels = null;
let hudValueX = [];
function hudLabelsLayer(k) {
  if (hudLabels) return hudLabels;
  const cv = document.createElement('canvas');
  cv.width = Math.ceil(280 * k); cv.height = Math.ceil(300 * k);
  const g = cv.getContext('2d');
  g.font = `bold ${Math.round(18 * k)}px 'Courier New', monospace`;
  g.textAlign = 'left';
  const x0 = Math.round(19 * k);
  let y = Math.round(38 * k);
  hudValueX = [];
  for (const label of HUD_LABELS) {
    g.fillStyle = 'rgba(0,0,0,0.8)';
    g.fillText(label, x0 + 2, y + 2);
    g.fillStyle = '#99aaaa';
    g.fillText(label, x0, y);
    hudValueX.push(x0 + g.measureText(label + ' ').width);
    y += Math.round(29 * k);
  }
  hudLabels = cv;
  return hudLabels;
}

function drawHud() {
  const g = ctx;
  const k = W / 1280;                 // HUD задан в пикселях кадра 1280x720

  // левая колонка: подписи готовым слоем, поверх — только значения
  g.drawImage(hudLabelsLayer(k), 0, 0);
  g.save();
  g.textAlign = 'left';
  g.font = `bold ${Math.round(18 * k)}px 'Courier New', monospace`;
  const values = [
    [hud.hp, '#ff5555'],
    [hud.dist, '#ffd93d'],
    [hud.kills, '#7CFC00'],
    [hud.ammo, '#ff9a00'],
    [hud.deaths, '#ff5555'],
    [hud.combo, '#ff9a00'],
    [hud.time, '#ffd93d'],
  ];
  let y = Math.round(38 * k);
  for (let i = 0; i < values.length; i++) {
    const [value, color] = values[i];
    const x = hudValueX[i];
    g.fillStyle = 'rgba(0,0,0,0.8)';
    g.fillText(String(value), x + 2, y + 2);
    g.fillStyle = color;
    g.fillText(String(value), x, y);
    y += Math.round(29 * k);
  }
  g.restore();

  // правая колонка: временные бонусы
  const bx = W - Math.round(19 * k);
  if (hud.buffs.length) {
    g.save();
    g.textAlign = 'right';
    g.font = `bold ${Math.round(17 * k)}px 'Courier New', monospace`;
    let by = Math.round(37 * k);
    for (const buff of hud.buffs) {
      g.fillStyle = 'rgba(0,0,0,0.8)';
      g.fillText(buff.text, bx + 2, by + 2);
      g.fillStyle = buff.color;
      g.fillText(buff.text, bx, by);
      by += Math.round(28 * k);
    }
    g.restore();
  }

  // полоса пятичасового забега
  const pw = W * 0.6, ph = Math.max(6, Math.round(10 * k));
  const px = W * 0.2, py = H * 0.97 - ph;
  g.save();
  g.fillStyle = 'rgba(0,0,0,0.55)';
  g.fillRect(px, py, pw, ph);
  g.strokeStyle = '#000';
  g.lineWidth = 2;
  g.strokeRect(px, py, pw, ph);
  const grad = g.createLinearGradient(px, 0, px + pw, 0);
  grad.addColorStop(0, '#ffd93d');
  grad.addColorStop(1, '#ff9a00');
  g.fillStyle = grad;
  g.fillRect(px + 2, py + 2, Math.max(0, (pw - 4) * hud.progress / 100), ph - 4);
  g.restore();
}

function drawStreamerCam() {
  const g = ctx;
  const size = W * 0.18;
  const x = W * 0.02, y = H - H * 0.04 - size;
  const cx = x + size / 2, cy = y + size / 2, r = size / 2;
  g.save();
  g.beginPath();
  g.arc(cx, cy, r, 0, Math.PI * 2);
  g.fillStyle = '#12121a';
  g.fill();
  g.save();
  g.clip();
  g.drawImage(streamerCanvas, x, y, size, size);   // кадр мухи внутри круга
  g.restore();
  g.beginPath();
  g.arc(cx, cy, r - 1, 0, Math.PI * 2);
  g.strokeStyle = 'rgba(255,255,255,0.08)';
  g.lineWidth = 2;
  g.stroke();
  // точка записи: мигает, как в прямом эфире. Ставим её на кольцо — раньше она
  // висела в углу квадрата вебки, то есть за пределами круга.
  const pulse = 0.68 + 0.32 * Math.sin(now() * 0.004);
  g.beginPath();
  g.arc(cx - r * 0.7, cy - r * 0.7, Math.max(3, 4 * (W / 1280)), 0, Math.PI * 2);
  g.fillStyle = `rgba(255,59,59,${pulse.toFixed(3)})`;
  g.fill();
  g.restore();
}

// ================================================================
// ============ ЦИКЛ =============================================
// ================================================================
let lastTime = performance.now();
let loopErrorCount = 0;

// Физика игры писалась под 60 кадров в секунду: игрок и враги сдвигаются на
// фиксированный шаг за кадр, и ИИ считает ходы в кадрах (15, 35, 45). В эфире
// кадров тридцать, и на одном шаге за кадр всё шло бы ровно вдвое медленнее —
// поэтому копим прошедшее время и делаем столько шагов по 1/60, сколько накопилось.
// Рисование при этом одно на кадр, так что эфир не дорожает.
const STEP_MS = 1000 / 60;
let stepAccum = 0;

function loop(n) {
  try {
    const dt = Math.min(100, n - lastTime);
    lastTime = n;
    stepAccum += dt;
    let steps = 0;
    while (stepAccum >= STEP_MS && steps < 8) {
      update(STEP_MS);
      stepAccum -= STEP_MS;
      steps++;
    }
    draw();
    updateStreamer(dt);
    drawStreamer(dt);
    drawStreamerCam();     // вебка мухи поверх мира
    drawHud();             // и HUD поверх всего
  } catch (e) {
    loopErrorCount++;
    // Раньше после первых четырёх ошибок лог замолкал навсегда, и сбой на
    // пятом часу эфира никто бы не увидел. Теперь каждые 300 ошибок — строка.
    if (loopErrorCount < 5 || loopErrorCount % 300 === 0) {
      console.error('Loop error #' + loopErrorCount + ':', e);
    }
  }
  requestAnimationFrame(loop);
}

ensureGenerated(W * 3);
requestAnimationFrame(loop);

// ============ УПРАВЛЕНИЕ ЗВУКОМ ============
// Кнопка и разблокировка звука по первому нажатию — удобства страницы. В эфире
// страницы нет: там звук включает сам источник, у которого тоже есть
// document.addEventListener, — поэтому всё под проверками.
const soundBtn = document.getElementById('soundToggle');
function setSoundBtn(on) {
  if (!soundBtn || !soundBtn.classList) return;
  soundBtn.textContent = on ? '🔊' : '🔈';
  soundBtn.classList.toggle('muted', !on);
}
if (soundBtn && soundBtn.addEventListener) {
  soundBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    setSoundBtn(AudioEngine.toggle());
  });
}
if (document.addEventListener) {
  document.addEventListener('pointerdown', () => {
    if (!AudioEngine.enabled) { AudioEngine.resume(); setSoundBtn(true); }
  }, { once: true });
}
</script>
