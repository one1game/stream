name: YouTube Live

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Длительность эфира в минутах. По умолчанию 300 — ровно столько идёт забег автоплатформера «стрим мухи» (muxa.html), так что финал игры ложится в конец эфира. Лимит job'а — 360, скрипт сам обрежет эфир до 355 минут от старта job'а."
        required: false
        default: "300"
      quality:
        description: "light — 960x540, normal — 1280x720, high — 1920x1080 (на бесплатном раннере может не удержать 30 fps)"
        required: false
        default: "normal"
      video:
        description: "Что показывать: newvideo.html — улица (живёт по музыке радио), muxa.html — авто-платформер «стрим мухи» со своим звуком, game_video.html — генератор игр"
        required: false
        default: "newvideo.html"

permissions:
  contents: read

# Второй эфир поверх первого на том же ключе YouTube не примет,
# поэтому параллельные запуски не отменяем, а ставим в очередь.
concurrency:
  group: youtube-live
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    # Жёсткий потолок GitHub-hosted раннера. Выше поставить нельзя.
    timeout-minutes: 360

    env:
      YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      # Node 20 штатно несёт Skia-канвас (@napi-rs/canvas), на котором
      # рендерится пейзаж. Python на раннере уже есть, доп. пакеты ему не нужны.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      # Запоминаем старт job'а: от него скрипт считает жёсткий предел в 355 мин,
      # чтобы установка зависимостей не съедала запас до лимита GitHub в 360 мин.
      - name: Запомнить начало job'а
        run: echo "JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Эфир
        run: |
          python scripts/start_stream.py \
            --minutes "${{ inputs.minutes }}" \
            --quality "${{ inputs.quality }}" \
            --video "${{ inputs.video }}" \
            --started-at "${JOB_STARTED_AT:-}"
