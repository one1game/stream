name: YouTube Live

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Длительность эфира в минутах. Лимит job'а — 360, поэтому по умолчанию 348 (запас на установку зависимостей)."
        required: false
        default: "348"

permissions:
  contents: read

# Второй эфир поверх первого на том же ключе YouTube не примет,
# поэтому параллельные запуски не отменяем, а ставим в очередь.
concurrency:
  group: youtube-live
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    # Жёсткий потолок GitHub-hosted раннера. Выше поставить нельзя.
    timeout-minutes: 360

    env:
      YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Установить FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Эфир
        run: python scripts/start_stream.py --minutes "${{ inputs.minutes }}"
