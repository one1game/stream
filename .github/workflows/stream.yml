name: YouTube Live

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "Длительность эфира в минутах. Лимит job'а — 360, поэтому по умолчанию 348 (запас на установку зависимостей)."
        required: false
        default: "348"
      quality:
        description: "light — экономно (854x480), normal — сбалансированно (1280x720), high — максимум качества (тяжелее, может не удержать 30 fps)"
        required: false
        default: "light"

permissions:
  contents: read

# Второй эфир поверх первого на том же ключе YouTube не примет,
# поэтому параллельные запуски не отменяем, а ставим в очередь.
concurrency:
  group: youtube-live
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    # Жёсткий потолок GitHub-hosted раннера. Выше поставить нельзя.
    timeout-minutes: 360

    env:
      YT_STREAM_KEY: ${{ secrets.YT_STREAM_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - uses: actions/checkout@v4

      # Node 20 штатно несёт Skia-канвас (@napi-rs/canvas), на котором
      # рендерится пейзаж. Python на раннере уже есть, доп. пакеты ему не нужны.
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Установить FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Эфир
        run: |
          python scripts/start_stream.py \
            --minutes "${{ inputs.minutes }}" \
            --quality "${{ inputs.quality }}"
